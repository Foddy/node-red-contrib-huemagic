El nodo «Hue Grupo» puede controlar a la vez varias luces agrupadas en el bridge.

### Configuración

Seleccione el Hue Bridge preconfigurado y haga clic en el botón de búsqueda para encontrar todos los grupos disponibles. Si ya conoce el ID de un grupo, también puede introducirlo aquí manualmente. Puede asignar internamente un nombre nuevo al grupo o utilizar el nombre predefinido. De forma opcional, puede desactivar todos los mensajes de estado automáticos de este nodo mediante el ajuste «Omitir los mensajes del nodo». El nodo dejará entonces de emitir actualizaciones. También puede elegir que el mensaje de inicialización del nodo no se suprima al iniciar Node-RED. Si activa este ajuste, recibirá un mensaje de estado del grupo seleccionado después de cada despliegue. Si prefiere que el nodo permanezca en silencio hasta que usted le envíe algo, active «Informar solo tras un comando». En ese caso ignorará los cambios realizados desde la app o desde un interruptor y solo responderá a sus propios comandos.

Si no selecciona ningún grupo y utiliza así la configuración del nodo, el nodo funciona en el llamado «modo universal». En este modo, el nodo recibe y emite todos los mensajes de estado del mismo tipo. También puede aplicar ajustes en modo universal a un grupo concreto pasando el ID del grupo correspondiente como cadena en `msg.topic` junto con sus ajustes.

### Consultar el estado

Emite el estado actual del grupo en cuanto se transfiere al nodo un objeto `msg.payload` con el siguiente contenido. Como alternativa, también puede pulsar el botón en la interfaz de Node-RED sin tener que enviar antes ningún mensaje al nodo.

: status (boolean): Devuelve el estado actual del grupo

### Encender / apagar (modo sencillo)

Para encender o apagar rápidamente todo un grupo en el modo sencillo, pase al nodo un objeto con el siguiente contenido.

: payload (boolean): `true` enciende todo el grupo, `false` lo apaga

### Comandos de grupo (ampliado)

Además de encender y apagar sin más, hay muchas otras opciones disponibles para controlar el grupo. Todos los nodos de HueMagic se pueden controlar con comandos aditivos. Esto significa que puede pasar primero un ajuste y después otro en un comando posterior sin descartar el ajuste anterior. Transfiera los siguientes parámetros en un objeto `msg.payload` para realizar ajustes más amplios en el grupo:

: on (boolean): `true` enciende todo el grupo, `false` lo apaga
: toggle (boolean | any): Alterna entre encendido y apagado, según el estado anterior del grupo
: brightness (int | string): Valor porcentual del brillo de la luz (0-100) o una cadena con el valor `auto` para ajustar el brillo automáticamente en función de la hora actual
: brightnessLevel (int): Valor numérico del brillo de la luz (0-254)
: incrementBrightness (int): Valor porcentual de un cambio relativo de brillo. El rango válido va de -100 % a +100 %. Los valores positivos aumentan el brillo. El valor predeterminado es +10 %
: decrementBrightness (int): Valor porcentual de un cambio relativo de brillo. El rango válido va de -100 % a +100 %. Los valores positivos reducen el brillo. El valor predeterminado es +10 %
: color (string): `random` para establecer un color aleatorio o un nombre de color en inglés (p. ej. `red`)
: hex (string): Valor de color en hexadecimal en forma de cadena
: rgb (array [0,0,0]): Valor de color en formato RGB en forma de array
: xyColor (object {x [float], y [float]}): Valor de color en el formato de color XY en forma de objeto
: image (string): Ruta de una imagen (local o en la web) para ajustar el color actual del grupo al color medio de la imagen
: colorTemp (int | string): Valor entre 153 y 500 para ajustar la temperatura de color del grupo, o los valores `cold`, `normal`, `warm`, `hot` y `auto`, donde `auto` fija la temperatura de color en función de la hora actual
: transitionTime (float): Tiempo de transición del ajuste actual en segundos. Si se pasa `0`, el grupo cambia de inmediato al ajuste deseado. Si pasa `3`, el grupo pasa al ajuste deseado con una ligera transición en los 3 segundos siguientes
: colorloop (float): Reproduce una animación «colorloop» durante los segundos indicados y después vuelve al estado original del grupo
: alert (float): Reproduce una animación «alert» durante los segundos indicados y después vuelve al estado original del grupo

### Mensajes de estado del nodo

Cuando se detecta un cambio en el grupo, el nodo devuelve el siguiente mensaje de estado.

> [!NOTE]
> El grupo solo emite mensajes de estado cuando se apaga la última luz o cuando se enciende la primera (si antes estaban todas apagadas).

A diferencia del nodo «Hue Luz», aquí dispone de mucha menos información de estado, ya que un grupo puede contener muchos tipos de dispositivo distintos con valores que no se pueden combinar.

#### Objeto de estado en `msg.payload`

: on (boolean): Estado del grupo, donde `true` significa encendido y `false` apagado
: brightness (float | boolean): Brillo del grupo en porcentaje o `false` si el grupo no se puede atenuar
: brightnessLevel (int | boolean): Brillo del grupo como valor numérico (0-254) o `false` si el grupo no se puede atenuar
: rgb (array [0,0,0]): Color actual del grupo en formato RGB (solo si está disponible)
: hex (string): Color actual del grupo en formato hexadecimal (solo si está disponible)
: xyColor (object {x [float], y [float]}): Color actual del grupo en el formato de color XY (solo si está disponible)
: colorTemp (int): Temperatura de color configurada actualmente para el grupo (solo si está disponible)
: updated (string): Momento de la última actualización del recurso por parte de HueMagic (ISO 8601)

#### Información sobre el grupo en `msg.info`

: id (string): Indica el nuevo ID del grupo
: idV1 (string | boolean): Indica el ID antiguo del grupo
: name (string): El nombre asignado actualmente al grupo
: resources (object) : Contiene todos los dispositivos y recursos que hay detrás del grupo
: type (string): El tipo de grupo (siempre `group`)

#### Cambios de estado en `msg.updated`

Enumera en forma de objeto los parámetros concretos que han cambiado con respecto al último estado del grupo. Si no se ha registrado ningún cambio, este objeto está vacío.

#### Último estado de la luz en `msg.lastState`

Contiene el objeto de estado completo (véanse los valores de salida anteriores) del último estado antes del último cambio. Si HueMagic aún no ha registrado el último estado, se emite `false`.

#### Último comando en `msg.command` (opcional)

Si el estado del nodo ha cambiado mediante un comando concreto, también se emite el comando completo que se ha ejecutado. De lo contrario, el nodo no emite este objeto.

### Ejemplos de HueMagic

HueMagic pone a su disposición algunas configuraciones de ejemplo para este nodo. Para importar un ejemplo completo en su interfaz de Node-RED, haga clic en el icono de menú de Node-RED, seleccione «Importar» y navegue hasta «Ejemplos» en la barra lateral de la ventana emergente. A continuación, seleccione la carpeta HueMagic y el nodo que desee para importar un flujo de ejemplo.
