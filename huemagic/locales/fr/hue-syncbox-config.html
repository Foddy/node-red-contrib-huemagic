<script type="text/markdown" data-help-name="hue-syncbox-config">
Se connecte à une Philips Hue Play HDMI Sync Box.

### Nom

Vous pouvez attribuer à la sync box un autre nom interne ou conserver le nom par défaut.

### IP de la Sync Box

L'adresse IP de votre sync box dans votre réseau local. Dès que vous l'avez saisie, HueMagic tente de lire le nom du boîtier et le renseigne pour vous.

### Jeton d'accès

La sync box ne fait pas partie de votre Hue Bridge et nécessite son propre jeton. Cliquez sur le bouton à côté du champ, puis maintenez enfoncé le bouton de la sync box jusqu'à ce que sa LED clignote en vert. HueMagic interroge le boîtier pendant une minute et enregistre le jeton dès qu'il répond.

### Actualisation

La sync box n'envoie pas son état d'elle-même : HueMagic l'interroge donc régulièrement. Ce réglage définit le nombre de secondes entre deux requêtes. La valeur par défaut de 10 secondes est un bon compromis entre réactivité du statut et trafic réseau — ne la baissez pas plus que nécessaire.
