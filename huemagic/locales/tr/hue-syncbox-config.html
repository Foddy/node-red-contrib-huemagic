Bir Philips Hue Play HDMI Sync Box'a bağlanır.

### Ad

Sync box'a dahili olarak farklı bir ad verebilir veya varsayılan adı koruyabilirsiniz.

### Sync Box IP adresi

Sync box cihazınızın yerel ağdaki IP adresi. Adresi girer girmez HueMagic cihazın adını okumayı dener ve sizin yerinize doldurur.

### Erişim belirteci

Sync box, Hue Bridge'inizin parçası değildir ve kendi belirtecine ihtiyaç duyar. Alanın yanındaki düğmeye tıklayın, ardından sync box üzerindeki düğmeyi LED yeşil yanıp sönene kadar basılı tutun. HueMagic cihazı bir dakika boyunca sorgular ve yanıt verir vermez belirteci kaydeder.

### Yenileme

Sync box durumunu kendiliğinden göndermez, bu yüzden HueMagic düzenli olarak sorar. Bu ayar iki istek arasında kaç saniye geçeceğini belirler. Varsayılan 10 saniye, hızlı durum bilgisi ile ağ trafiği arasında iyi bir dengedir — gerçekten gerekmedikçe daha düşük ayarlamayın.
