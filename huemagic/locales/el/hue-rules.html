Ο κόμβος «Hue Κανόνας» μπορεί να ενεργοποιεί ή να απενεργοποιεί κανόνες αποθηκευμένους στο bridge και να ανακτά τις ρυθμίσεις τους.

### Ρύθμιση

Επιλέξτε το προρυθμισμένο Hue Bridge και πατήστε το κουμπί αναζήτησης για να βρείτε όλους τους διαθέσιμους κανόνες. Αν γνωρίζετε ήδη το αναγνωριστικό του κανόνα, μπορείτε να το καταχωρίσετε και χειροκίνητα. Εναλλακτικά μπορείτε να δώσετε νέο όνομα ή να κρατήσετε το προκαθορισμένο όνομα του κανόνα. Προαιρετικά μπορείτε να απενεργοποιήσετε όλα τα αυτόματα μηνύματα κατάστασης αυτού του κόμβου με τη ρύθμιση «Παράβλεψη των μηνυμάτων του κόμβου». Ο κόμβος δεν θα εκπέμπει πλέον ενημερώσεις. Εναλλακτικά μπορείτε να επιλέξετε να μην αποκρύπτεται το μήνυμα αρχικοποίησης του κόμβου κατά την εκκίνηση του Node-RED. Αν προτιμάτε ο κόμβος να παραμένει σιωπηλός μέχρι να του στείλετε κάτι, ενεργοποιήστε την «Αναφορά μόνο μετά από εντολή». Τότε αγνοεί τις αλλαγές από την εφαρμογή ή από έναν διακόπτη και απαντά μόνο στις δικές σας εντολές.

Αν δεν επιλέξετε κανόνα και χρησιμοποιήσετε έτσι τις ρυθμίσεις του κόμβου, ο κόμβος λειτουργεί στη λεγόμενη «καθολική λειτουργία». Σε αυτήν τη λειτουργία ο κόμβος λαμβάνει και εκπέμπει όλα τα μηνύματα κατάστασης ίδιου τύπου. Μπορείτε επίσης να εφαρμόσετε ρυθμίσεις σε συγκεκριμένο κανόνα στέλνοντας το αντίστοιχο αναγνωριστικό ως συμβολοσειρά στο `msg.topic` μαζί με τις ρυθμίσεις σας.

### Ανάκτηση ιδιοτήτων / ρυθμίσεων

Εξάγει τις τρέχουσες ιδιότητες του κανόνα μόλις σταλεί στον κόμβο ένα αντικείμενο `msg.payload` με το παρακάτω περιεχόμενο. Εναλλακτικά μπορείτε να πατήσετε το κουμπί στο περιβάλλον του Node-RED, χωρίς να χρειάζεται να στείλετε πρώτα μήνυμα στον κόμβο.

: status (boolean): Επιστρέφει την τρέχουσα κατάσταση του κανόνα

### Ενεργοποίηση / απενεργοποίηση κανόνα

Ο κανόνας μπορεί να ενεργοποιείται και να απενεργοποιείται όποτε χρειάζεται. Αν ο κανόνας απενεργοποιηθεί, δεν εκτελείται πλέον στο bridge μέχρι να τον ενεργοποιήσετε ξανά. Στείλτε γι' αυτό ένα αντικείμενο με το παρακάτω περιεχόμενο:

: payload (boolean): `true` ενεργοποιεί τον κανόνα, `false` τον απενεργοποιεί

### Μηνύματα κατάστασης του κόμβου

Μόλις αλλάξει η κατάσταση (ενεργοποιημένος / απενεργοποιημένος) ενός κανόνα, ο κόμβος επιστρέφει το ακόλουθο μήνυμα κατάστασης:

#### Αντικείμενο κατάστασης στο `msg.payload`

: enabled (boolean): Δηλώνει αν ο κανόνας είναι ενεργοποιημένος ή απενεργοποιημένος
: triggered (string): Χρόνος της τελευταίας εκτέλεσης (ISO 8601)

#### Πληροφορίες για τον κανόνα στο `msg.info`

: id (string): Το μοναδικό αναγνωριστικό του κανόνα
: created (string): Ημερομηνία δημιουργίας του κανόνα (ISO 8601)
: name (string): Όνομα του κανόνα στο bridge
: timesTriggered (int): Πόσες φορές εκτελέστηκε ο κανόνας στο bridge
: owner (string): Αναγνωριστικό του κατόχου αυτού του κανόνα
: status (string): Κατάσταση του κανόνα ως συμβολοσειρά

#### Συνθήκες του κανόνα στο `msg.conditions` (πίνακας)

: address (string): Διαδρομή προς ένα χαρακτηριστικό ενός αισθητήρα
: operator (string): Τελεστής
: value (string): Η τιμή που θα ελεγχθεί

#### Ενέργειες του κανόνα στο `msg.actions` (πίνακας)

: address (string): Η διεύθυνση προορισμού του πόρου
: method (string): Η μέθοδος του αιτήματος
: body (object): Η ενέργεια που θα εκτελεστεί

#### Αλλαγές κατάστασης στο `msg.updated`

Απαριθμεί ως αντικείμενο τις επιμέρους παραμέτρους που άλλαξαν σε σχέση με την προηγούμενη κατάσταση του κανόνα. Αν δεν καταγράφηκαν αλλαγές, το αντικείμενο είναι κενό.

#### Τελευταία κατάσταση του κανόνα στο `msg.lastState`

Περιέχει το πλήρες αντικείμενο (δείτε τις τιμές εξόδου παραπάνω) της τελευταίας κατάστασης πριν από την τελευταία καταγεγραμμένη αλλαγή του κανόνα. Αν το HueMagic δεν έχει καταγράψει ακόμη την προηγούμενη κατάσταση, εξάγεται `false`.

#### Τελευταία εντολή στο `msg.command` (προαιρετικό)

Αν η κατάσταση του κόμβου άλλαξε μέσω κάποιας εντολής, εξάγεται και ολόκληρη η εντολή που εκτελέστηκε. Διαφορετικά ο κόμβος δεν εξάγει αυτό το αντικείμενο.

### Παραδείγματα από το HueMagic

Το HueMagic παρέχει μερικές έτοιμες ρυθμίσεις για αυτόν τον κόμβο. Για να εισαγάγετε ένα πλήρες παράδειγμα στο περιβάλλον Node-RED, πατήστε το εικονίδιο μενού του Node-RED, επιλέξτε «Import» και μεταβείτε στο «Examples» στην πλαϊνή στήλη του παραθύρου. Έπειτα επιλέξτε τον φάκελο HueMagic και τον κόμβο που θέλετε για να εισαγάγετε μια ροή παραδείγματος.
