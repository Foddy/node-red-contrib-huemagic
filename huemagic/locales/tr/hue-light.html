«Hue Işık» düğümü, bridge'e bağlı ışıkları denetleyebilir ve onların durum mesajlarını alabilir.

### Kurulum

Önceden yapılandırılmış Hue Bridge'i seçin ve mevcut tüm ışıkları bulmak için arama düğmesine tıklayın. Bir ışığın kimliğini zaten biliyorsanız, buraya elle de girebilirsiniz. Işığa dahili olarak yeni bir ad verebilir veya önceden tanımlı adı kullanabilirsiniz. İsteğe bağlı olarak «Düğümün mesajlarını yoksay» ayarıyla bu düğümün tüm otomatik durum mesajlarını devre dışı bırakabilirsiniz. Düğüm bundan sonra cihaz güncellemesi yayınlamaz. Alternatif olarak, Node-RED başlatılırken düğümün başlatma mesajının bastırılmamasını seçebilirsiniz. Bu ayarı etkinleştirirseniz her dağıtımdan sonra seçili ışığın durum mesajını alırsınız. Düğümün siz bir şey gönderene kadar sessiz kalmasını tercih ediyorsanız «Yalnızca bir komuttan sonra bildir» seçeneğini etkinleştirin. Bu durumda uygulamadan veya bir anahtardan gelen değişiklikleri yok sayar ve yalnızca sizin komutlarınıza yanıt verir.

«Renk adlandırmayı etkinleştir» ayarını açarsanız, düğüm her durum mesajında ayarlı ışık rengini tanımlamaya çalışır. Çıktıda güncel rengin İngilizce açıklamasını içeren ek bir parametre alırsınız.

Bir ışık seçmez ve düğüm yapılandırmasını bu şekilde kullanırsanız, düğüm «evrensel mod» adı verilen modda çalışır. Bu modda düğüm aynı türdeki tüm durum mesajlarını alır ve yayınlar. Evrensel modda ayarları belirli bir ışığa uygulamak için ilgili ışık kimliğini `msg.topic` içinde dize olarak ayarlarınızla birlikte gönderebilirsiniz.

### Durumu sorgulama

Düğüme aşağıdaki içeriğe sahip bir `msg.payload` nesnesi iletildiğinde ışığın güncel durumunu verir. Alternatif olarak, önce düğüme bir mesaj göndermeden Node-RED arayüzündeki düğmeye de basabilirsiniz.

: status (boolean): Işığın güncel durumunu döndürür

### Işığı açma / kapatma (basit)

Basit modda bir ışığı hızlıca açmak veya kapatmak için düğüme aşağıdaki içeriğe sahip bir nesne gönderin:

: payload (boolean): `true` ışığı açar, `false` kapatır

### Işık komutları (genişletilmiş)

Yalnızca açıp kapatmanın yanı sıra ışığı denetlemek için başka birçok seçenek de vardır. HueMagic'teki tüm düğümler eklemeli komutlarla denetlenebilir. Yani önce bir ayarı, sonra daha ileri bir komutta başka bir ayarı, öncekini iptal etmeden gönderebilirsiniz. Işıkta daha kapsamlı ayarlar yapmak için aşağıdaki parametreleri bir `msg.payload` nesnesinde gönderin:

: on (boolean): `true` ışığı açar, `false` kapatır
: toggle (boolean | any): Işığın önceki durumuna göre açma ve kapatma arasında geçiş yapar
: brightness (int | string): Işık parlaklığının yüzde değeri (0-100) veya parlaklığın güncel saate göre otomatik ayarlanması için `auto` değerini içeren bir dize
: brightnessLevel (int): Işık parlaklığının sayısal değeri (0-254)
: incrementBrightness (int | boolean): Işığın yüzde kaç parlatılacağını belirtir veya %10'luk adımlarla parlatmak için `true`
: decrementBrightness (int | boolean): Işığın yüzde kaç karartılacağını belirtir veya %10'luk adımlarla karartmak için `true`
: color (string): Rastgele bir renk için `random` veya İngilizce bir renk adı (ör. `red`)
: hex (string): Onaltılık renk değeri (dize olarak)
: rgb (array [0,0,0]): RGB biçiminde renk değeri (dizi olarak)
: xyColor (object {x [float], y [float]}): XY renk biçiminde renk değeri (nesne olarak)
: gradient (object {hex […]}): Desteklenen bir renk nesnesi (ör. `hex`, `rgb`, …) ve birden çok renk içeren, uyumlu ışıklara gradyan ayarlayan bir nesne
: mixColor (object): Güncel ışık rengiyle karıştırılacak bir renk. `color`, `hex`, `rgb` veya `xyColor` nesnelerini ve isteğe bağlı olarak karışım oranını yüzde belirten `amount` (int) değerini kabul eder
: image (string): Işığın güncel rengini görüntünün ortalama rengine ayarlamak için bir görüntünün yolu (yerel veya web'de)
: saturation (int): Güncel rengin doygunluk yüzdesi (beta)
: colorTemp (int | string): Işığın renk sıcaklığını ayarlamak için 153 ile 500 arasında bir değer ya da `cold`, `normal`, `warm`, `hot` ve `auto` değerleri — `auto`, renk sıcaklığını güncel saate göre belirler
: incrementColorTemp (int | boolean): Renk sıcaklığının ne kadar daha sıcak olacağını belirten değer veya 50'lik adımlarla sıcaklaştırmak için `true`
: decrementColorTemp (int | boolean): Renk sıcaklığının ne kadar daha soğuk olacağını belirten değer veya 50'lik adımlarla soğutmak için `true`
: transitionTime (float): Geçerli ayarın saniye cinsinden geçiş süresi. `0` girilirse ışık istenen ayara hemen geçer. `3` girilirse ışık sonraki 3 saniye içinde hafif bir geçişle istenen ayara ulaşır
: colorloop (float): Seçilen saniye boyunca bir «colorloop» animasyonu oynatır ve ardından ışığın özgün durumuna döner
: alert (float): Seçilen saniye boyunca bir «alert» animasyonu oynatır ve ardından ışığın özgün durumuna döner

### Düğümün durum mesajları

Işık ayarlarında bir değişiklik algılandığı anda (Node-RED üzerinden ya da dışarıdan fark etmeksizin) düğüm aşağıdaki durum mesajını döndürür:

#### `msg.payload` altındaki durum nesnesi

: on (boolean): Işığın durumu; `true` açık, `false` kapalı anlamına gelir
: brightness (int | boolean): Yüzde cinsinden güncel parlaklık veya ışık parlaklık ayarını desteklemiyorsa `false`
: brightnessLevel (int | boolean): 0-254 aralığında güncel parlaklık veya ışık parlaklık ayarını desteklemiyorsa `false`
: reachable (boolean | string): Işık bridge'e bağlıysa `true`, bağlantı durumu farklıysa `unknown`
: connectionStatus (string): Bridge ile olan güncel bağlantı durumu (dize olarak). Değer olarak `connected`, `disconnected`, `connectivity_issue` veya `unidirectional_incoming` içerebilir
: rgb (array [int, int, int] | optional): Işık renkleri gösterebiliyorsa RGB değeri olarak güncel ışık rengi
: hex (string | optional): Işık renkleri gösterebiliyorsa onaltılık değer olarak güncel ışık rengi
: xyColor (object {x [float], y [float]} | optional): Işık renkleri gösterebiliyorsa XY değeri olarak güncel ışık rengi
: color (string | optional): Işık renkleri gösterebiliyorsa ve düğümün ilgili ayarı etkinse, güncel rengin İngilizce adı
: gradient (object | optional): Işık gradyanları destekliyorsa, mevcut tüm renk birimlerini içeren güncel gradyan ayarı (dizi olarak); `colors` renkleri, `numColors` gradyandaki ayarlı renk sayısını, `totalColors` ise kaynağın gradyanda destekleyebileceği en fazla renk sayısını verir
: colorTemp (int | boolean | optional): Işık renk sıcaklıklarını gösterebiliyorsa ve bir renk sıcaklığı ayarlandıysa, ışığın güncel renk sıcaklığı
: colorTempName (string | optional): Işık renk sıcaklıklarını gösterebiliyorsa ve bir renk sıcaklığı ayarlandıysa, `cold`, `normal`, `warm` veya `hot` değerlerini içeren açıklayıcı dize olarak güncel renk sıcaklığı. Aksi hâlde `unknown` verilir
: updated (string): Kaynağın HueMagic tarafından son güncellenme zamanı (ISO 8601)

#### `msg.info` altındaki ışık bilgileri

: id (string): Işığın yeni kimliğini belirtir
: idV1 (string | boolean): Işığın eski kimliğini belirtir
: uniqueId (string): Işığın benzersiz kimliği
: deviceId (string): Cihazın benzersiz kimliği
: name (string): Işığın geçerli adı
: type (string): Işığın türü (her zaman `light`)
: softwareVersion (string): Işığın geçerli ürün yazılımı
: model (object): Işığın model bilgilerini `id`, `manufacturer`, `name`, `type`, `certified`, `friendsOfHue`, `colorGamut` ve `colorGamutType` altında içerir

#### `msg.updated` altındaki durum değişiklikleri

Işığın önceki durumuna kıyasla değişen parametreleri bir nesne olarak listeler. Herhangi bir değişiklik kaydedilmediyse bu nesne boştur.

#### `msg.lastState` altındaki son ışık durumu

Son değişiklikten önceki durumun eksiksiz durum nesnesini içerir (yukarıdaki çıktı değerlerine bakın). HueMagic önceki durumu henüz kaydetmediyse `false` verilir.

#### `msg.command` altındaki son komut (isteğe bağlı)

Düğümün durumu belirli bir komutla değiştiyse, yürütülen komutun tamamı da çıktı olarak verilir. Aksi hâlde düğüm bu nesneyi çıktı olarak vermez.

### HueMagic örnekleri

HueMagic bu düğüm için bazı örnek yapılandırmalar sunar. Node-RED arayüzünüze eksiksiz bir örnek aktarmak için Node-RED menü simgesine tıklayın, «Import» seçeneğini seçin ve açılan pencerenin kenar çubuğunda «Examples» bölümüne gidin. Ardından HueMagic klasörünü ve istediğiniz düğümü seçerek örnek bir akış aktarın.
