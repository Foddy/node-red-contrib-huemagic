Συνδέεται σε ένα Philips Hue Play HDMI Sync Box.

### Όνομα

Μπορείτε να δώσετε στο sync box ένα εναλλακτικό, εσωτερικό όνομα ή να κρατήσετε το προεπιλεγμένο.

### IP του Sync Box

Η διεύθυνση IP του sync box στο τοπικό σας δίκτυο. Μόλις την καταχωρίσετε, το HueMagic προσπαθεί να διαβάσει το όνομα της συσκευής και το συμπληρώνει για εσάς.

### Διακριτικό πρόσβασης

Το sync box δεν ανήκει στο Hue Bridge σας και χρειάζεται δικό του διακριτικό. Πατήστε το κουμπί δίπλα στο πεδίο και κρατήστε έπειτα πατημένο το κουμπί στο sync box μέχρι να αναβοσβήσει πράσινη η λυχνία. Το HueMagic ρωτά τη συσκευή επί ένα λεπτό και αποθηκεύει το διακριτικό μόλις εκείνη απαντήσει.

### Ανανέωση

Το sync box δεν στέλνει από μόνο του την κατάστασή του, γι' αυτό το HueMagic τη ζητά τακτικά. Αυτή η ρύθμιση καθορίζει πόσα δευτερόλεπτα μεσολαβούν ανάμεσα σε δύο αιτήματα. Η προεπιλογή των 10 δευτερολέπτων είναι καλός συμβιβασμός ανάμεσα σε άμεση ενημέρωση και κίνηση δικτύου — μην τη μειώσετε περισσότερο απ' όσο πραγματικά χρειάζεστε.
