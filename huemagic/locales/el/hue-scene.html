Ο κόμβος «Hue Σκηνή» μπορεί να επαναφέρει σκηνές αποθηκευμένες στο bridge και να τις εφαρμόσει σε συγκεκριμένες ομάδες.

### Ρύθμιση

Επιλέξτε το προρυθμισμένο Hue Bridge και πατήστε το κουμπί αναζήτησης για να βρείτε όλες τις διαθέσιμες σκηνές. Οι σκηνές ταξινομούνται πρώτα κατά δωμάτιο ή ζώνη και έπειτα κατά όνομα, ώστε οι σκηνές ενός δωματίου να παραμένουν πάντα μαζί στη λίστα. Αν γνωρίζετε ήδη το αναγνωριστικό της σκηνής, μπορείτε να το καταχωρίσετε και χειροκίνητα. Εναλλακτικά μπορείτε να δώσετε στη σκηνή ένα εσωτερικό όνομα ή να κρατήσετε το προκαθορισμένο.

### Ενεργοποίηση σκηνής

Μπορείτε να ενεργοποιήσετε μια προκαθορισμένη σκηνή στέλνοντας ένα αντικείμενο με το παρακάτω περιεχόμενο:

: payload (boolean): Ενεργοποιεί μια προρυθμισμένη σκηνή
: transitionTime (float): Χρόνος μετάβασης της σκηνής σε δευτερόλεπτα. Αν σταλεί `0`, η σκηνή εφαρμόζεται αμέσως. Αν στείλετε `3`, τα φώτα μεταβαίνουν στη σκηνή μέσα στα επόμενα 3 δευτερόλεπτα. Το bridge δέχεται έως 6000 δευτερόλεπτα
: brightness (float): Φωτεινότητα ολόκληρης της σκηνής σε ποσοστό (`0` – `100`), ώστε να μπορείτε να καλείτε την ίδια σκηνή πιο φωτεινή ή πιο χαμηλή ανάλογα με την ώρα της ημέρας

> [!NOTE]
> Και οι δύο ρυθμίσεις είναι διαθέσιμες μόνο για κανονικές σκηνές. Μια έξυπνη σκηνή ακολουθεί τις ώρες που έχετε ορίσει για αυτήν στην εφαρμογή Philips Hue.

### Ενεργοποίηση σκηνής σε καθολική λειτουργία

Αν χρησιμοποιείτε αυτόν τον κόμβο στη λεγόμενη «καθολική λειτουργία» και δεν έχετε ορίσει σκηνή στις ρυθμίσεις του, μπορείτε να στείλετε τη σκηνή που θέλετε στον κόμβο ως εντολή. Στείλτε γι' αυτό ένα αντικείμενο `msg.payload` με το παρακάτω περιεχόμενο:

: scene (string): Αναγνωριστικό της σκηνής που θα ενεργοποιηθεί στο bridge

### Ενεργοποίηση σκηνής σε συγκεκριμένες ομάδες

Συνδέστε την έξοδο αυτού του κόμβου με μία ή περισσότερες ομάδες για να εφαρμόσετε μια σκηνή σε συγκεκριμένες ομάδες. Εναλλακτικά μπορείτε να το κάνετε «δυναμικά», στέλνοντας στον κόμβο ένα αντικείμενο `msg.payload` με το παρακάτω περιεχόμενο:

: group (string | array [string,…]): Αναγνωριστικό της ομάδας ή πίνακας με τα αναγνωριστικά περισσότερων ομάδων, ώστε η σκηνή να περιοριστεί σε αυτές

### Περισσότερες πληροφορίες για τον κόμβο

Αυτός ο κόμβος δεν εκπέμπει μηνύματα κατάστασης.

> [!IMPORTANT]
> Μπορείτε να εφαρμόσετε σκηνές σε ομάδες μόνο αν αυτές είναι ήδη συνδεδεμένες με την αντίστοιχη σκηνή στο bridge. Διαφορετικά δεν εφαρμόζεται τίποτα.

### Παραδείγματα από το HueMagic

Το HueMagic παρέχει μερικές έτοιμες ρυθμίσεις για αυτόν τον κόμβο. Για να εισαγάγετε ένα πλήρες παράδειγμα στο περιβάλλον Node-RED, πατήστε το εικονίδιο μενού του Node-RED, επιλέξτε «Import» και μεταβείτε στο «Examples» στην πλαϊνή στήλη του παραθύρου. Έπειτα επιλέξτε τον φάκελο HueMagic και τον κόμβο που θέλετε για να εισαγάγετε μια ροή παραδείγματος.
