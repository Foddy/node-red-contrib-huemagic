«Hue Hoparlör» düğümü, bir Hue Secure kapı zilinin seslerini çalabilir ve onu iç mekân sireni olarak kullanabilir.

### Kurulum

Önceden yapılandırılmış Hue Bridge'i seçin ve mevcut tüm hoparlörleri bulmak için arama düğmesine tıklayın. Hoparlörün kimliğini zaten biliyorsanız, buraya elle de girebilirsiniz. Hoparlöre dahili olarak yeni bir ad verebilir veya önceden tanımlı adı kullanabilirsiniz. İsteğe bağlı olarak «Düğümün mesajlarını yoksay» ayarıyla bu düğümün tüm otomatik durum mesajlarını devre dışı bırakabilirsiniz. Düğüm bundan sonra cihaz güncellemesi yayınlamaz. Alternatif olarak, Node-RED başlatılırken düğümün başlatma mesajının bastırılmamasını seçebilirsiniz. Bu ayarı etkinleştirirseniz her dağıtımdan sonra seçili hoparlörün durum mesajını alırsınız. Düğümün siz bir şey gönderene kadar sessiz kalmasını tercih ediyorsanız «Yalnızca bir komuttan sonra bildir» seçeneğini etkinleştirin. Bu durumda uygulamadan veya bir anahtardan gelen değişiklikleri yok sayar ve yalnızca sizin komutlarınıza yanıt verir.

Bir hoparlör seçmez ve düğüm yapılandırmasını bu şekilde kullanırsanız, düğüm «evrensel mod» adı verilen modda çalışır. Bu modda düğüm aynı türdeki tüm durum mesajlarını alır ve yayınlar. Evrensel modda ayarları belirli bir hoparlöre uygulamak için ilgili hoparlör kimliğini `msg.topic` içinde dize olarak ayarlarınızla birlikte gönderebilirsiniz.

### Durumu sorgulama

Düğüme aşağıdaki içeriğe sahip bir `msg.payload` nesnesi iletildiğinde hoparlörün güncel durumunu verir. Alternatif olarak, önce düğüme bir mesaj göndermeden Node-RED arayüzündeki düğmeye de basabilirsiniz.

: status (boolean): Hoparlörün güncel durumunu döndürür

### Ses çalma

Bir hoparlörün üç ayrı kanalı vardır. `chime` kapı zili sesidir, `alarm` sirendir ve `alert` kısa bir bildirimdir. Bir cihazın gerçekte hangi sesleri bildiği `msg.info.sounds` altında listelenir. Aşağıdaki parametreleri bir `msg.payload` nesnesinde gönderin:

: chime (string | object | boolean): Kapı zili sesinin adı; `false` yeniden durdurur
: alarm (string | object | boolean): Siren sesinin adı; `false` yeniden durdurur
: alert (string | object | boolean): Bildirim sesinin adı; `false` yeniden durdurur
: mute (boolean): `true` hoparlörü susturur, `false` sesi yeniden açar

Yalnızca ses adı yerine, ses düzeyini ve süreyi denetlemek için bir nesne de gönderebilirsiniz:

: sound (string): Sesin adı, ör. `ding_dong_classic` veya `siren`
: volume (int): Yüzde cinsinden ses düzeyi (0-100)
: duration (float): Saniye cinsinden çalma süresi

### Düğümün durum mesajları

Hoparlör çalmaya başladığında veya durduğunda düğüm aşağıdaki durum mesajını döndürür.

> [!NOTE]
> Bridge en son çalınan sesi bildirir ve bunu ancak çalma bittikten epey sonra sıfırlar; bu yüzden bu değerler sesin biraz gerisinde kalır.

#### `msg.payload` altındaki durum nesnesi

: reachable (boolean | string): Hoparlör bridge'e bağlıysa `true`, bağlantı durumu farklıysa `unknown`
: connectionStatus (string): Bridge ile olan güncel bağlantı durumu (dize olarak). Değer olarak `connected`, `disconnected`, `connectivity_issue` veya `unidirectional_incoming` içerebilir
: playing (boolean): Hoparlör herhangi bir ses çalarken `true`
: chime (string | boolean): Çalmakta olan kapı zili sesinin adı veya `false`
: alarm (string | boolean): Çalmakta olan siren sesinin adı veya `false`
: alert (string | boolean): Çalmakta olan bildirim sesinin adı veya `false`
: muted (boolean): Hoparlörün susturulup susturulmadığını belirtir
: updated (string): Kaynağın HueMagic tarafından son güncellenme zamanı (ISO 8601)

#### `msg.info` altındaki hoparlör bilgileri

: id (string): Hoparlörün yeni kimliğini belirtir
: idV1 (string | boolean): Hoparlörün eski kimliğini belirtir
: uniqueId (string): Hoparlörün benzersiz kimliği
: deviceId (string): Cihazın benzersiz kimliği
: name (string): Hoparlörün geçerli adı
: type (string): Cihazın türü (her zaman `speaker`)
: softwareVersion (string): Hoparlörün geçerli ürün yazılımı
: battery (float | boolean): Hoparlörün geçerli pil düzeyi, pil yoksa `false`
: batteryState (string | boolean): Pil düzeyinin geçerli durumu. Değer olarak `normal`, `low` veya `critical`, pil yoksa `false` içerebilir
: sounds (object): Bu cihazın bildiği sesleri `chime`, `alarm` ve `alert` altında içerir
: model (object): Hoparlörün model bilgilerini `id`, `manufacturer`, `name`, `type` ve `certified` altında içerir

#### `msg.updated` altındaki durum değişiklikleri

Hoparlörün önceki durumuna kıyasla değişen parametreleri bir nesne olarak listeler. Herhangi bir değişiklik kaydedilmediyse bu nesne boştur.

#### `msg.lastState` altındaki son hoparlör durumu

Son kaydedilen değişiklikten önceki durumun eksiksiz durum nesnesini içerir (yukarıdaki çıktı değerlerine bakın). HueMagic önceki durumu henüz kaydetmediyse `false` verilir.

#### `msg.command` altındaki son komut (isteğe bağlı)

Düğümün durumu belirli bir komutla değiştiyse, yürütülen komutun tamamı da çıktı olarak verilir. Aksi hâlde düğüm bu nesneyi çıktı olarak vermez.

### HueMagic örnekleri

HueMagic bu düğüm için bazı örnek yapılandırmalar sunar. Node-RED arayüzünüze eksiksiz bir örnek aktarmak için Node-RED menü simgesine tıklayın, «Import» seçeneğini seçin ve açılan pencerenin kenar çubuğunda «Examples» bölümüne gidin. Ardından HueMagic klasörünü ve istediğiniz düğümü seçerek örnek bir akış aktarın.
