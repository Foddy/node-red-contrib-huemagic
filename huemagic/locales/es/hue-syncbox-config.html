<script type="text/markdown" data-help-name="hue-syncbox-config">
Se conecta a una Philips Hue Play HDMI Sync Box.

### Nombre

Puede asignar a la sync box un nombre interno alternativo o conservar el nombre predeterminado.

### IP de la Sync Box

La dirección IP de su sync box en la red local. En cuanto la introduzca, HueMagic intentará leer el nombre de la caja y lo rellenará por usted.

### Token de acceso

La sync box no forma parte de su Hue Bridge y necesita su propio token. Haga clic en el botón situado junto al campo y, a continuación, mantenga pulsado el botón de la sync box hasta que su LED parpadee en verde. HueMagic seguirá preguntando a la caja durante un minuto y guardará el token en cuanto responda.

### Actualización

La sync box no envía su estado por sí sola, así que HueMagic se lo pregunta con regularidad. Este ajuste define cuántos segundos transcurren entre dos consultas. El valor predeterminado de 10 segundos es un buen compromiso entre un estado ágil y el tráfico de red: no lo baje más de lo que realmente necesite.
