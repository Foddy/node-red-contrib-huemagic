Węzeł „Hue Przyciski” odbiera zdarzenia przełączania z urządzeń wejściowych podłączonych do bridge.

### Konfiguracja

Wybierz skonfigurowany Hue Bridge i kliknij przycisk wyszukiwania, aby znaleźć wszystkie dostępne przełączniki i przyciski. Jeśli znasz już identyfikator przełącznika lub przycisku, możesz go też wpisać ręcznie. Możesz nadać urządzeniu własną nazwę wewnętrzną albo zachować nazwę domyślną. Opcjonalnie możesz wyłączyć wszystkie automatyczne komunikaty stanu tego węzła ustawieniem „Pomijaj komunikaty węzła”. Węzeł przestanie wtedy wysyłać zdarzenia przełączania. Możesz też zdecydować, aby komunikat inicjalizacji węzła nie był pomijany przy starcie Node-RED. Po włączeniu tego ustawienia po każdym wdrożeniu otrzymasz komunikat stanu wybranego przełącznika lub przycisku. Jeśli wolisz, aby węzeł milczał, dopóki czegoś do niego nie wyślesz, włącz „Zgłaszaj tylko po poleceniu”. Węzeł zignoruje wtedy zmiany z aplikacji lub z przełącznika i odpowie wyłącznie na Twoje polecenia.

Jeśli nie wybierzesz przełącznika ani przycisku i użyjesz konfiguracji węzła w ten sposób, węzeł działa w tzw. „trybie uniwersalnym”. W tym trybie węzeł odbiera i wysyła wszystkie komunikaty stanu tego samego typu.

W sekcji „Dodatkowe wyjścia” możesz dodać jedno wyjście na każdy zakres przycisków, z których każde jest wyzwalane przez określone działanie (początek naciśnięcia, koniec krótkiego naciśnięcia, koniec długiego naciśnięcia po osiągnięciu skonfigurowanego czasu trwania, lub cyklicznie podczas trwania długiego naciśnięcia). Pierwsze wyjście węzła nadal zawsze otrzymuje każde zdarzenie, tak jak dotychczas; dodatkowe wyjścia otrzymują kopię komunikatu tylko wtedy, gdy pasują zarówno zakres przycisków, jak i działanie.

### Odczyt stanu

Zwraca bieżący stan przełącznika lub przycisku, gdy tylko do węzła zostanie przekazany obiekt `msg.payload` o następującej zawartości. Możesz też nacisnąć przycisk w interfejsie Node-RED, bez wcześniejszego wysyłania komunikatu do węzła.

: status (boolean): Zwraca bieżący stan przełącznika lub przycisku

### Komunikaty stanu węzła

Gdy tylko zostanie naciśnięty przycisk, węzeł zwraca następujący komunikat stanu:

#### Obiekt stanu w `msg.payload`

: reachable (boolean | string): `true`, jeśli przełącznik lub przycisk jest połączony z bridge, `unknown`, jeśli stan połączenia jest inny
: connectionStatus (string): Bieżący stan połączenia z bridge w postaci ciągu znaków. Może przyjmować wartości `connected`, `disconnected`, `connectivity_issue` lub `unidirectional_incoming`
: button (int | boolean): Numeryczny identyfikator ostatnio naciśniętego przycisku albo `false`, jeśli nie naciśnięto żadnego
: action (string | boolean): `false`, jeśli nie naciśnięto żadnego przycisku, albo `initial_press`, `repeat`, `short_release`, `long_press`, `long_release` lub `double_short_release` w postaci ciągu znaków
: rotation (object | boolean): `false`, jeśli urządzenie nie ma pokrętła lub nim nie obrócono; w przeciwnym razie obiekt z polami `action` (`start` lub `repeat`), `direction` (`clock_wise` lub `counter_clock_wise`), `clockwise` (wartość logiczna), `steps` (1000 kroków to pełny obrót), `degrees` i `duration` w milisekundach
: updated (string): Czas ostatniej aktualizacji zasobu przez HueMagic (ISO 8601)

#### Informacje o przełączniku lub przycisku w `msg.info`

: id (string): Wskazuje nowy identyfikator przełącznika lub przycisku
: idV1 (string | boolean): Wskazuje stary identyfikator przełącznika lub przycisku
: uniqueId (string): Unikatowy identyfikator przełącznika lub przycisku
: deviceId (string): Unikatowy identyfikator urządzenia
: name (string): Aktualnie ustawiona nazwa przełącznika lub przycisku
: type (string): Typ przełącznika lub przycisku (zawsze `button`)
: softwareVersion (string): Bieżące oprogramowanie układowe przełącznika lub przycisku
: battery (float | boolean): Bieżący poziom naładowania baterii przełącznika lub przycisku, `false`, gdy urządzenie nie ma baterii
: batteryState (string | boolean): Bieżący stan poziomu baterii. Może przyjmować wartości `normal`, `low` lub `critical`, albo `false`, gdy urządzenie nie ma baterii
: model (object): Zawiera informacje o modelu przełącznika lub przycisku w polach `id`, `manufacturer`, `name`, `type` i `certified`

#### Zmiany stanu w `msg.updated`

Wymienia w postaci obiektu poszczególne parametry, które zmieniły się względem poprzedniego stanu przełącznika lub przycisku. Jeśli nie zarejestrowano żadnych zmian, obiekt jest pusty.

#### Poprzedni stan przełącznika lub przycisku w `msg.lastState`

Zawiera pełny obiekt stanu (patrz wartości wyjściowe powyżej) sprzed ostatniej zarejestrowanej zmiany. Jeśli HueMagic nie zarejestrował jeszcze poprzedniego stanu, zwracane jest `false`.

#### Ostatnie polecenie w `msg.command` (opcjonalnie)

Jeśli stan węzła zmienił się w wyniku określonego polecenia, wysyłane jest również całe wykonane polecenie. W przeciwnym razie węzeł nie wysyła tego obiektu.

### Przykłady z HueMagic

HueMagic udostępnia kilka przykładowych konfiguracji dla tego węzła. Aby zaimportować gotowy przykład do interfejsu Node-RED, kliknij ikonę menu Node-RED, wybierz „Import”, a następnie przejdź do „Examples” na pasku bocznym okna. Wybierz katalog HueMagic i żądany węzeł, aby zaimportować przykładowy przepływ.
