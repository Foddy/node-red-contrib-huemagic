<script type="text/markdown" data-help-name="hue-speaker">
Der „Hue Lautsprecher“-Node kann die Töne eines Hue Secure Gongs abspielen und ihn als Innensirene nutzen.

### Einrichtung

Wählen Sie die vorkonfigurierte Hue Bridge und klicken Sie auf die Suchschaltfläche, um alle verfügbaren Lautsprecher zu finden. Wenn Sie die ID des Lautsprechers bereits kennen, können Sie sie auch manuell an dieser Stelle eintragen. Sie können intern entweder einen neuen Namen für den Lautsprecher vergeben oder den vordefinierten Namen des Lautsprechers wählen. Optional können Sie auch alle automatischen Statusmeldungen dieses Nodes deaktivieren, indem Sie die Einstellung „Ignoriere die Mitteilungen des Nodes“ anklicken. Der Node wird anschließend keine Geräteupdates mehr ausgeben. Alternativ können Sie auch auswählen, ob die Initialisierungsnachricht des Nodes beim Start von Node-RED nicht unterdrückt werden soll. Wenn Sie diese Einstellung aktivieren, erhalten Sie nach jedem Deploy eine Statusmeldung des aktuell ausgewählten Lautsprechers. Wenn der Node lieber still bleiben soll, bis Sie ihm etwas schicken, aktivieren Sie „Nur nach einem Befehl melden“. Er ignoriert dann Änderungen aus der App oder von einem Schalter und antwortet nur auf Ihre eigenen Befehle.

Wenn Sie keinen Lautsprecher auswählen und die Node-Konfiguration so anwenden, arbeitet der Node im sogenannten „Universalmodus“. In diesem Modus empfängt der Node alle Statusmitteilungen desselben Typs und gibt diese aus. Sie können aber auch Einstellungen im Universalmodus auf einen bestimmten Lautsprecher anwenden, indem Sie die entsprechende Lautsprecher-ID als String in `msg.topic` zusammen mit Ihren Einstellungen übergeben.

### Status abrufen

Gibt den aktuellen Status des Lautsprechers aus, sobald ein `msg.payload`-Objekt mit folgendem Inhalt an den Node übergeben wurde. Sie können alternativ auch den Button in der Node-RED-Oberfläche betätigen, ohne vorher eine Nachricht an den Node übergeben zu müssen.

: status (boolean) : Gibt den aktuellen Status des Lautsprechers zurück

### Ton abspielen

Ein Lautsprecher kennt drei getrennte Kanäle. Der `chime` ist der Klingelton, der `alarm` die Sirene und der `alert` ein kurzer Hinweiston. Welche Töne ein Gerät tatsächlich kennt, steht unter `msg.info.sounds`. Übergeben Sie folgende Parameter an ein `msg.payload`-Objekt:

: chime (string | object | boolean) : Name des Klingeltons, `false` stoppt ihn wieder
: alarm (string | object | boolean) : Name des Sirenentons, `false` stoppt ihn wieder
: alert (string | object | boolean) : Name des Hinweistons, `false` stoppt ihn wieder
: mute (boolean) : `true` schaltet den Lautsprecher stumm, `false` hebt die Stummschaltung wieder auf

Statt eines einfachen Tonnamens können Sie auch ein Objekt übergeben, um Lautstärke und Dauer zu steuern:

: sound (string) : Name des Tons, z. B. `ding_dong_classic` oder `siren`
: volume (int) : Lautstärke in Prozent (0-100)
: duration (float) : Abspieldauer in Sekunden

### Statusnachrichten des Nodes

Sobald der Lautsprecher zu spielen beginnt oder aufhört, wird folgende Statusnachricht vom Node zurückgegeben.

> [!NOTE]
> Die Bridge meldet den zuletzt gespielten Ton und setzt ihn erst deutlich nach dem Ende der Wiedergabe zurück — diese Werte hinken dem Ton also etwas hinterher.

#### Statusobjekt unter `msg.payload`

: reachable (boolean | string) : `true` wenn der Lautsprecher mit der Bridge verbunden ist, `unknown` wenn der Verbindungsstatus abweicht
: connectionStatus (string) : Der aktuelle Verbindungsstatus mit der Bridge in Form eines Strings. Kann `connected`, `disconnected`, `connectivity_issue` oder `unidirectional_incoming` als Wert beinhalten
: playing (boolean) : `true`, solange der Lautsprecher irgendeinen Ton abspielt
: chime (string | boolean) : Name des laufenden Klingeltons oder `false`
: alarm (string | boolean) : Name des laufenden Sirenentons oder `false`
: alert (string | boolean) : Name des laufenden Hinweistons oder `false`
: muted (boolean) : Zeigt an, ob der Lautsprecher stummgeschaltet ist
: updated (string) : Zeitpunkt der letzten Aktualisierung der Ressource von HueMagic (ISO 8601)

#### Informationen zum Lautsprecher unter `msg.info`

: id (string) : Gibt die neue ID des Lautsprechers an
: idV1 (string | boolean) : Gibt die alte ID des Lautsprechers an
: uniqueId (string) : Die eindeutige ID des Lautsprechers
: deviceId (string) : Die eindeutige ID des Geräts
: name (string) : Der aktuell gesetzte Name des Lautsprechers
: type (string) : Der Typ des Geräts (immer `speaker`)
: softwareVersion (string) : Die aktuelle Firmware des Lautsprechers
: battery (float | boolean) : Der aktuelle Batteriestand des Lautsprechers, `false` wenn keine Batterie vorhanden ist
: batteryState (string | boolean) : Der aktuelle Zustand des Batteriestands. Kann `normal`, `low` oder `critical` als Wert beinhalten, `false` wenn keine Batterie vorhanden ist
: sounds (object) : Beinhaltet die Töne, die dieses Gerät kennt, unter `chime`, `alarm` und `alert`
: model (object) : Beinhaltet die Modellinformationen des Lautsprechers unter `id`, `manufacturer`, `name`, `type` und `certified`

#### Statusänderungen unter `msg.updated`

Listet einzelne Parameter in Form eines Objekts auf, die sich im Vergleich zum letzten Zustand des Lautsprechers geändert haben. Wenn keine Änderungen registriert wurden, ist dieses Objekt leer.

#### Letzter Zustand des Lautsprechers unter `msg.lastState`

Beinhaltet das komplette Statusobjekt (siehe Ausgabewerte oben) des letzten Zustands vor der zuletzt registrierten Änderung. Wenn der letzte Zustand von HueMagic noch nicht registriert wurde, wird `false` ausgegeben.

#### Letzter Befehl unter `msg.command` (optional)

Wenn sich der Status des Nodes über einen bestimmten Befehl geändert hat, wird zusätzlich der komplette Befehl ausgegeben, der ausgeführt wurde. Andernfalls wird dieses Objekt vom Node nicht ausgegeben.

### Beispiele von HueMagic

HueMagic stellt einige Beispielkonfigurationen zu diesem Node zur Verfügung. Um ein fertiges Beispiel in Ihrer Node-RED-Oberfläche zu importieren, klicken Sie auf das Menü-Icon von Node-RED, wählen Sie dann „Import“ und navigieren Sie in der Sidebar des Popups auf „Beispiele“. Wählen Sie anschließend den HueMagic-Ordner aus und Ihren gewünschten Node, um einen Beispielflow zu importieren.
