Il nodo «Hue Pulsanti» riceve gli eventi di commutazione dai dispositivi di input collegati al bridge.

### Configurazione

Selezioni il Hue Bridge preconfigurato e faccia clic sul pulsante di ricerca per trovare tutti gli interruttori e i pulsanti disponibili. Se conosce già l'ID dell'interruttore o del pulsante, può anche inserirlo qui manualmente. Può assegnare internamente un nuovo nome al dispositivo oppure mantenere quello predefinito. Facoltativamente può disattivare tutti i messaggi di stato automatici di questo nodo tramite l'impostazione «Ignora i messaggi del nodo». Il nodo non emetterà più eventi di commutazione. In alternativa può scegliere che il messaggio di inizializzazione del nodo non venga soppresso all'avvio di Node-RED. Attivando questa impostazione riceverà un messaggio di stato dell'interruttore o pulsante selezionato dopo ogni deploy. Se preferisce che il nodo resti in silenzio finché non gli invia qualcosa, attivi «Segnala solo dopo un comando». In tal caso ignorerà le modifiche provenienti dall'app o da un interruttore e risponderà solo ai suoi comandi.

Se non seleziona alcun interruttore o pulsante e utilizza così la configurazione del nodo, il nodo funziona nella cosiddetta «modalità universale». In questa modalità il nodo riceve ed emette tutti i messaggi di stato dello stesso tipo.

### Richiedere lo stato

Emette lo stato attuale dell'interruttore o del pulsante non appena al nodo viene trasmesso un oggetto `msg.payload` con il seguente contenuto. In alternativa può anche premere il pulsante nell'interfaccia di Node-RED senza dover inviare prima un messaggio al nodo.

: status (boolean): Restituisce lo stato attuale dell'interruttore o del pulsante

### Messaggi di stato del nodo

Non appena viene premuto un tasto, il nodo restituisce il seguente messaggio di stato:

#### Oggetto di stato in `msg.payload`

: reachable (boolean | string): `true` se l'interruttore o il pulsante è collegato al bridge, `unknown` se lo stato della connessione è diverso
: connectionStatus (string): Lo stato attuale della connessione con il bridge sotto forma di stringa. Può contenere `connected`, `disconnected`, `connectivity_issue` o `unidirectional_incoming` come valore
: button (int | boolean): ID numerico dell'ultimo tasto premuto o `false` se non è stato premuto alcun tasto
: action (string | boolean): `false` se non è stato premuto alcun tasto, oppure `initial_press`, `repeat`, `short_release`, `long_press`, `long_release` o `double_short_release` sotto forma di stringa
: rotation (object | boolean): `false` se il dispositivo non ha una rotella o non è stato ruotato; in caso contrario un oggetto con `action` (`start` o `repeat`), `direction` (`clock_wise` o `counter_clock_wise`), `clockwise` (booleano), `steps` (1000 passi corrispondono a un giro completo), `degrees` e `duration` in millisecondi
: updated (string): Momento dell'ultimo aggiornamento della risorsa da parte di HueMagic (ISO 8601)

#### Informazioni sull'interruttore o pulsante in `msg.info`

: id (string): Indica il nuovo ID dell'interruttore o del pulsante
: idV1 (string | boolean): Indica il vecchio ID dell'interruttore o del pulsante
: uniqueId (string): L'ID univoco dell'interruttore o del pulsante
: deviceId (string): L'ID univoco del dispositivo
: name (string): Il nome attualmente assegnato all'interruttore o al pulsante
: type (string): Il tipo dell'interruttore o del pulsante (sempre `button`)
: softwareVersion (string): Il firmware attuale dell'interruttore o del pulsante
: battery (float | boolean): Il livello attuale della batteria dell'interruttore o del pulsante, `false` se non è presente alcuna batteria
: batteryState (string | boolean): Lo stato attuale del livello della batteria. Può contenere `normal`, `low` o `critical` come valore, `false` se non è presente alcuna batteria
: model (object): Contiene le informazioni sul modello dell'interruttore o del pulsante in `id`, `manufacturer`, `name`, `type` e `certified`

#### Variazioni di stato in `msg.updated`

Elenca sotto forma di oggetto i singoli parametri modificati rispetto all'ultimo stato dell'interruttore o del pulsante. Se non è stata registrata alcuna modifica, questo oggetto è vuoto.

#### Ultimo stato dell'interruttore o del pulsante in `msg.lastState`

Contiene l'oggetto di stato completo (vedi i valori di uscita sopra) dell'ultimo stato prima dell'ultima modifica registrata. Se HueMagic non ha ancora registrato l'ultimo stato, viene emesso `false`.

#### Ultimo comando in `msg.command` (facoltativo)

Se lo stato del nodo è cambiato a seguito di un determinato comando, viene emesso anche l'intero comando eseguito. In caso contrario, il nodo non emette questo oggetto.

### Esempi di HueMagic

HueMagic mette a disposizione alcune configurazioni di esempio per questo nodo. Per importare un esempio completo nella sua interfaccia Node-RED, faccia clic sull'icona del menu di Node-RED, selezioni «Importa» e navighi fino a «Esempi» nella barra laterale della finestra. Selezioni quindi la cartella HueMagic e il nodo desiderato per importare un flusso di esempio.
