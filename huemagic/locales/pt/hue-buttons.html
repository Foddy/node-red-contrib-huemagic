O nó «Hue Botões» recebe os eventos de comutação dos dispositivos de entrada ligados ao bridge.

### Configuração

Selecione o Hue Bridge pré-configurado e clique no botão de pesquisa para encontrar todos os interruptores e botões disponíveis. Se já souber o ID do interruptor ou botão, também o pode introduzir aqui manualmente. Pode atribuir internamente um novo nome ao dispositivo ou manter o nome predefinido. Opcionalmente, pode desativar todas as mensagens de estado automáticas deste nó através da definição «Ignorar as mensagens do nó». O nó deixará de emitir eventos de comutação. Em alternativa, pode escolher que a mensagem de inicialização do nó não seja suprimida no arranque do Node-RED. Se ativar esta definição, receberá uma mensagem de estado do interruptor ou botão selecionado após cada implementação. Se preferir que o nó permaneça em silêncio até lhe enviar algo, ative «Comunicar apenas após um comando». Nesse caso, ignora as alterações feitas na aplicação ou num interruptor e responde apenas aos seus próprios comandos.

Se não selecionar nenhum interruptor ou botão e utilizar assim a configuração do nó, o nó funciona no chamado «modo universal». Neste modo, o nó recebe e emite todas as mensagens de estado do mesmo tipo.

### Consultar o estado

Emite o estado atual do interruptor ou botão assim que for transmitido ao nó um objeto `msg.payload` com o seguinte conteúdo. Em alternativa, também pode premir o botão na interface do Node-RED sem ter de enviar previamente uma mensagem ao nó.

: status (boolean): Devolve o estado atual do interruptor ou botão

### Mensagens de estado do nó

Assim que uma tecla é premida, o nó devolve a seguinte mensagem de estado:

#### Objeto de estado em `msg.payload`

: reachable (boolean | string): `true` se o interruptor ou botão estiver ligado ao bridge, `unknown` se o estado da ligação divergir
: connectionStatus (string): O estado atual da ligação com o bridge sob a forma de uma cadeia de carateres. Pode conter `connected`, `disconnected`, `connectivity_issue` ou `unidirectional_incoming` como valor
: button (int | boolean): ID numérico da última tecla premida ou `false` se nenhuma tecla foi premida
: action (string | boolean): `false` se nenhuma tecla foi premida, ou `initial_press`, `repeat`, `short_release`, `long_press`, `long_release` ou `double_short_release` sob a forma de cadeia de carateres
: rotation (object | boolean): `false` se o dispositivo não tiver roda ou não tiver sido rodado; caso contrário, um objeto com `action` (`start` ou `repeat`), `direction` (`clock_wise` ou `counter_clock_wise`), `clockwise` (booleano), `steps` (1000 passos correspondem a uma volta completa), `degrees` e `duration` em milissegundos
: updated (string): Momento da última atualização do recurso pelo HueMagic (ISO 8601)

#### Informações sobre o interruptor ou botão em `msg.info`

: id (string): Indica o novo ID do interruptor ou botão
: idV1 (string | boolean): Indica o ID antigo do interruptor ou botão
: uniqueId (string): O ID único do interruptor ou botão
: deviceId (string): O ID único do dispositivo
: name (string): O nome atualmente atribuído ao interruptor ou botão
: type (string): O tipo do interruptor ou botão (sempre `button`)
: softwareVersion (string): O firmware atual do interruptor ou botão
: battery (float | boolean): O nível atual da bateria do interruptor ou botão, `false` quando não existe bateria
: batteryState (string | boolean): O estado atual do nível da bateria. Pode conter `normal`, `low` ou `critical` como valor, ou `false` quando não existe bateria
: model (object): Contém as informações de modelo do interruptor ou botão em `id`, `manufacturer`, `name`, `type` e `certified`

#### Alterações de estado em `msg.updated`

Enumera sob a forma de um objeto os parâmetros que foram alterados em relação ao último estado do interruptor ou botão. Se não tiverem sido registadas alterações, este objeto está vazio.

#### Último estado do interruptor ou botão em `msg.lastState`

Contém o objeto de estado completo (ver os valores de saída acima) do último estado antes da última alteração registada. Se o HueMagic ainda não tiver registado o último estado, é emitido `false`.

#### Último comando em `msg.command` (opcional)

Se o estado do nó tiver sido alterado através de um determinado comando, é também emitido o comando completo que foi executado. Caso contrário, o nó não emite este objeto.

### Exemplos do HueMagic

O HueMagic disponibiliza algumas configurações de exemplo para este nó. Para importar um exemplo completo na sua interface Node-RED, clique no ícone de menu do Node-RED, selecione «Importar» e navegue até «Exemplos» na barra lateral da janela. Em seguida, selecione a pasta HueMagic e o nó pretendido para importar um fluxo de exemplo.
