«Hue Otomasyon» düğümü, Philips Hue uygulamasında oluşturduğunuz otomasyonları etkinleştirip devre dışı bırakabilir.

### Kurulum

Önceden yapılandırılmış Hue Bridge'i seçin ve mevcut tüm otomasyonları bulmak için arama düğmesine tıklayın. Otomasyonun kimliğini zaten biliyorsanız, buraya elle de girebilirsiniz. Otomasyona dahili olarak yeni bir ad verebilir veya önceden tanımlı adı kullanabilirsiniz. İsteğe bağlı olarak «Düğümün mesajlarını yoksay» ayarıyla bu düğümün tüm otomatik durum mesajlarını devre dışı bırakabilirsiniz. Düğüm bundan sonra güncelleme yayınlamaz. Alternatif olarak, Node-RED başlatılırken düğümün başlatma mesajının bastırılmamasını seçebilirsiniz. Bu ayarı etkinleştirirseniz her dağıtımdan sonra seçili otomasyonun durum mesajını alırsınız. Düğümün siz bir şey gönderene kadar sessiz kalmasını tercih ediyorsanız «Yalnızca bir komuttan sonra bildir» seçeneğini etkinleştirin. Bu durumda uygulamadan veya bir anahtardan gelen değişiklikleri yok sayar ve yalnızca sizin komutlarınıza yanıt verir.

Bir otomasyon seçmez ve düğüm yapılandırmasını bu şekilde kullanırsanız, düğüm «evrensel mod» adı verilen modda çalışır. Bu modda düğüm aynı türdeki tüm durum mesajlarını alır ve yayınlar. Evrensel modda ayarları belirli bir otomasyona uygulamak için ilgili otomasyon kimliğini `msg.topic` içinde dize olarak ayarlarınızla birlikte gönderebilirsiniz.

### Otomasyonu etkinleştirme / devre dışı bırakma

Devre dışı bırakılan bir otomasyon bridge üzerinde kalır ve istediğiniz zaman yeniden etkinleştirilebilir. Bunun için aşağıdaki içeriğe sahip bir nesne gönderin:

: payload (boolean): `true` otomasyonu etkinleştirir, `false` devre dışı bırakır
: enabled (boolean): Bir nesne göndermeyi tercih ederseniz yukarıdakiyle aynı
: toggle (boolean | any): Önceki duruma göre etkin ve devre dışı arasında geçiş yapar

### Düğümün durum mesajları

Otomasyon değiştiği anda düğüm aşağıdaki durum mesajını döndürür:

#### `msg.payload` altındaki durum nesnesi

: enabled (boolean): Otomasyonun etkin olup olmadığını belirtir
: running (boolean): Bridge otomasyonu fiilen yürütürken `true`
: status (string | boolean): Geçerli durum. Değer olarak `initializing`, `running`, `disabled` veya `errored` içerebilir
: lastError (string | boolean): Bridge tarafından bildirilen son hata veya `false`
: updated (string): Kaynağın HueMagic tarafından son güncellenme zamanı (ISO 8601)

#### `msg.info` altındaki otomasyon bilgileri

: id (string): Otomasyonun kimliğini belirtir
: idV1 (string | boolean): Otomasyonun eski kimliğini belirtir
: name (string | boolean): Otomasyona Philips Hue uygulamasında verdiğiniz ad
: type (string): Kaynağın türü (her zaman `automation`)
: script (string | boolean): Otomasyonun arkasındaki davranış betiğinin kimliği

#### `msg.configuration` altındaki yapılandırma

Otomasyonun ayarlarını, Philips Hue uygulamasının kaydettiği biçimde içerir. Yapı, otomasyonun türüne bağlıdır ve değiştirilmeden aktarılır.

#### `msg.updated` altındaki durum değişiklikleri

Otomasyonun önceki durumuna kıyasla değişen parametreleri bir nesne olarak listeler. Herhangi bir değişiklik kaydedilmediyse bu nesne boştur.

#### `msg.lastState` altındaki son otomasyon durumu

Son kaydedilen değişiklikten önceki durumun eksiksiz durum nesnesini içerir (yukarıdaki çıktı değerlerine bakın). HueMagic önceki durumu henüz kaydetmediyse `false` verilir.

#### `msg.command` altındaki son komut (isteğe bağlı)

Düğümün durumu belirli bir komutla değiştiyse, yürütülen komutun tamamı da çıktı olarak verilir. Aksi hâlde düğüm bu nesneyi çıktı olarak vermez.

### HueMagic örnekleri

HueMagic bu düğüm için bazı örnek yapılandırmalar sunar. Node-RED arayüzünüze eksiksiz bir örnek aktarmak için Node-RED menü simgesine tıklayın, «Import» seçeneğini seçin ve açılan pencerenin kenar çubuğunda «Examples» bölümüne gidin. Ardından HueMagic klasörünü ve istediğiniz düğümü seçerek örnek bir akış aktarın.
