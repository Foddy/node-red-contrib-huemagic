Ο κόμβος «Hue Magic» μπορεί να εφαρμόζει σύνθετες και προσαρμοσμένες κινούμενες σκηνές σε φώτα και ομάδες.

### Ρύθμιση

Δώστε πρώτα ένα όνομα στον κόμβο ώστε να αναγνωρίζετε καθαρά την κινούμενη σκηνή σας στο περιβάλλον του Node-RED. Στη συνέχεια έχετε την επιλογή ανάμεσα σε «Επανάληψη» και «Επαναφορά». Επιλέξτε την επανάληψη αν θέλετε η σκηνή σας να εκτελείται ατέρμονα σε ένα φως ή μια ομάδα μέχρι να τη σταματήσετε χειροκίνητα. Αν θέλετε να επαναφέρετε την προηγούμενη κατάσταση του πόρου προορισμού (φως / ομάδα) μετά το τέλος, επιλέξτε «Επαναφορά». Διαφορετικά, το τελευταίο καρέ παραμένει στον αντίστοιχο πόρο.

Παρακάτω μπορείτε να διαλέξετε από τις έτοιμες κινούμενες σκηνές του HueMagic. Πατήστε αυτήν που θέλετε για να την ορίσετε.

### Έναρξη / διακοπή κινούμενης σκηνής

Για να αναπαραγάγετε ή να σταματήσετε μια κινούμενη σκηνή, στείλτε στον κόμβο ένα αντικείμενο με το παρακάτω περιεχόμενο:

: payload (boolean): `true` ξεκινά την κινούμενη σκηνή, `false` τη σταματά

### Προσαρμοσμένες κινούμενες σκηνές

Αν στείλετε δική σας κινούμενη σκηνή στον κόμβο, η προεπιλεγμένη έτοιμη σκηνή (αν έχει οριστεί) αντικαθίσταται προσωρινά από τη δική σας. Οι δικές σας σκηνές HueMagic είναι μια ακολουθία εντολών συγκεντρωμένων σε έναν πίνακα. Κάθε στοιχείο του πίνακα αποτελεί ένα βήμα — και ένα βήμα μπορεί να αποτελείται από περισσότερα καρέ (εφέ μετάβασης).

Δημιουργήστε έναν `array` με τα επιμέρους βήματα της σκηνής ως αντικείμενα και στείλτε τον στον κόμβο HueMagic στο `msg.payload.steps`.

: delay (int): Χιλιοστά του δευτερολέπτου αναμονής μέχρι να εκτελεστεί αυτό το βήμα
: animation (object): Το αντικείμενο περιέχει την ενέργεια ή τις ενέργειες που θα εκτελεστούν σε αυτό το βήμα. Ίδιες παράμετροι με τους κόμβους «Hue Φως» και «Hue Ομάδα»

### Παράδειγμα προσαρμοσμένης κινούμενης σκηνής

Αυτό το παράδειγμα δείχνει πώς θα μπορούσε να είναι μια απλή κινούμενη σκηνή. Στο πρώτο βήμα αναμένεται η καθυστέρηση των 500 χιλιοστών του δευτερολέπτου. Έπειτα το χρώμα του φωτός αλλάζει αργά σε κόκκινο μέσα σε ένα δευτερόλεπτο. Μόλις το φως γίνει εντελώς κόκκινο, εκτελείται το δεύτερο βήμα, που έχει επίσης καθυστέρηση 500 χιλιοστών. Τέλος, το χρώμα αλλάζει σε μπλε.

Αν έχετε ορίσει επανάληψη, η διαδικασία επαναλαμβάνεται ατέρμονα μέχρι να σταματήσετε χειροκίνητα τη σκηνή ή να κάνετε ξανά deploy τον κόμβο.

Στείλτε το παρακάτω αντικείμενο στο `msg.payload` για να αναπαραχθεί η κινούμενη σκηνή του παραδείγματος.

    {
        "animate": true,
        "steps": [
            {
                "delay": 500,
                "animation": {
                    "hex": "#FF0000",
                    "transitionTime": 1
                }
            },
            {
                "delay": 500,
                "animation": {
                    "hex": "#0000FF",
                    "transitionTime": 1
                }
            }
        ]
    }

### Ειδικές εντολές

Μερικές φορές είναι χρήσιμο να αναπαράγεται μια σκηνή με τυχαία σειρά — π.χ. για πιο ρεαλιστική μίμηση φωτιάς. Για να αναπαράγονται τα βήματα τυχαία, μπορείτε να στείλετε την εξής εντολή στο `msg.payload.specials`:

: randomOrder (boolean | any): `true` ενεργοποιεί την τυχαία αναπαραγωγή των επιμέρους βημάτων

### Συμβουλές και υποδείξεις

Αυτός ο κόμβος δεν εκπέμπει μηνύματα κατάστασης. Συνδέστε την έξοδο του κόμβου με μια ομάδα αντί με μεμονωμένα φώτα, αν θέλετε να κινήσετε πολλά φώτα ταυτόχρονα με την ίδια σκηνή. Οι προεπισκοπήσεις των έτοιμων σκηνών είναι προσομοιώσεις και μπορεί να διαφέρουν ελαφρώς (χρονισμός, χρώματα) από την πραγματική σκηνή σε έναν πόρο.

### Παραδείγματα από το HueMagic

Το HueMagic παρέχει μερικές έτοιμες ρυθμίσεις για αυτόν τον κόμβο. Για να εισαγάγετε ένα πλήρες παράδειγμα στο περιβάλλον Node-RED, πατήστε το εικονίδιο μενού του Node-RED, επιλέξτε «Import» και μεταβείτε στο «Examples» στην πλαϊνή στήλη του παραθύρου. Έπειτα επιλέξτε τον φάκελο HueMagic και τον κόμβο που θέλετε για να εισαγάγετε μια ροή παραδείγματος.
