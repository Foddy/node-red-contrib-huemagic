Łączy się z urządzeniem Philips Hue Play HDMI Sync Box.

### Nazwa

Możesz nadać sync box własną nazwę wewnętrzną albo zachować nazwę domyślną.

### Adres IP Sync Box

Adres IP Twojego sync box w sieci lokalnej. Po jego wpisaniu HueMagic spróbuje odczytać nazwę urządzenia i wstawi ją za Ciebie.

### Token dostępu

Sync box nie należy do Twojego Hue Bridge i wymaga własnego tokenu. Kliknij przycisk obok pola, a następnie przytrzymaj przycisk na sync box, aż dioda zamiga na zielono. HueMagic przez minutę odpytuje urządzenie i zapisuje token, gdy tylko ono odpowie.

### Odświeżanie

Sync box nie wysyła swojego stanu samodzielnie, dlatego HueMagic regularnie o niego pyta. To ustawienie określa, ile sekund mija między dwoma zapytaniami. Domyślne 10 sekund to dobry kompromis między szybką reakcją stanu a ruchem sieciowym — nie ustawiaj mniej, niż faktycznie potrzebujesz.
