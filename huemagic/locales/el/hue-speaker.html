Ο κόμβος «Hue Ηχείο» μπορεί να αναπαράγει τους ήχους ενός κουδουνιού Hue Secure και να το χρησιμοποιεί ως εσωτερική σειρήνα.

### Ρύθμιση

Επιλέξτε το προρυθμισμένο Hue Bridge και πατήστε το κουμπί αναζήτησης για να βρείτε όλα τα διαθέσιμα ηχεία. Αν γνωρίζετε ήδη το αναγνωριστικό του ηχείου, μπορείτε να το καταχωρίσετε και χειροκίνητα. Μπορείτε να δώσετε στο ηχείο ένα νέο εσωτερικό όνομα ή να κρατήσετε το προκαθορισμένο. Προαιρετικά μπορείτε να απενεργοποιήσετε όλα τα αυτόματα μηνύματα κατάστασης αυτού του κόμβου με τη ρύθμιση «Παράβλεψη των μηνυμάτων του κόμβου». Ο κόμβος δεν θα εκπέμπει πλέον ενημερώσεις συσκευής. Εναλλακτικά μπορείτε να επιλέξετε να μην αποκρύπτεται το μήνυμα αρχικοποίησης του κόμβου κατά την εκκίνηση του Node-RED. Αν ενεργοποιήσετε αυτή τη ρύθμιση, θα λαμβάνετε μήνυμα κατάστασης του επιλεγμένου ηχείου μετά από κάθε deploy. Αν προτιμάτε ο κόμβος να παραμένει σιωπηλός μέχρι να του στείλετε κάτι, ενεργοποιήστε την «Αναφορά μόνο μετά από εντολή». Τότε αγνοεί τις αλλαγές από την εφαρμογή ή από έναν διακόπτη και απαντά μόνο στις δικές σας εντολές.

Αν δεν επιλέξετε ηχείο και χρησιμοποιήσετε έτσι τις ρυθμίσεις του κόμβου, ο κόμβος λειτουργεί στη λεγόμενη «καθολική λειτουργία». Σε αυτήν τη λειτουργία ο κόμβος λαμβάνει και εκπέμπει όλα τα μηνύματα κατάστασης ίδιου τύπου. Μπορείτε επίσης να εφαρμόσετε ρυθμίσεις σε συγκεκριμένο ηχείο στέλνοντας το αντίστοιχο αναγνωριστικό ως συμβολοσειρά στο `msg.topic` μαζί με τις ρυθμίσεις σας.

### Ανάκτηση κατάστασης

Εξάγει την τρέχουσα κατάσταση του ηχείου μόλις σταλεί στον κόμβο ένα αντικείμενο `msg.payload` με το παρακάτω περιεχόμενο. Εναλλακτικά μπορείτε να πατήσετε το κουμπί στο περιβάλλον του Node-RED, χωρίς να χρειάζεται να στείλετε πρώτα μήνυμα στον κόμβο.

: status (boolean): Επιστρέφει την τρέχουσα κατάσταση του ηχείου

### Αναπαραγωγή ήχου

Ένα ηχείο έχει τρία ξεχωριστά κανάλια. Το `chime` είναι ο ήχος κουδουνιού, το `alarm` η σειρήνα και το `alert` μια σύντομη ειδοποίηση. Ποιους ήχους γνωρίζει πραγματικά μια συσκευή αναγράφεται στο `msg.info.sounds`. Στείλτε τις παρακάτω παραμέτρους σε ένα αντικείμενο `msg.payload`:

: chime (string | object | boolean): Όνομα του ήχου κουδουνιού· `false` τον σταματά ξανά
: alarm (string | object | boolean): Όνομα του ήχου σειρήνας· `false` τον σταματά ξανά
: alert (string | object | boolean): Όνομα του ήχου ειδοποίησης· `false` τον σταματά ξανά
: mute (boolean): `true` θέτει το ηχείο σε σίγαση, `false` την καταργεί

Αντί για σκέτο όνομα ήχου μπορείτε να στείλετε και ένα αντικείμενο για να ελέγξετε ένταση και διάρκεια:

: sound (string): Όνομα του ήχου, π.χ. `ding_dong_classic` ή `siren`
: volume (int): Ένταση σε ποσοστό (0-100)
: duration (float): Χρόνος αναπαραγωγής σε δευτερόλεπτα

### Μηνύματα κατάστασης του κόμβου

Μόλις το ηχείο ξεκινήσει ή σταματήσει την αναπαραγωγή, ο κόμβος επιστρέφει το ακόλουθο μήνυμα κατάστασης.

> [!NOTE]
> Το bridge αναφέρει τον ήχο που παίχτηκε τελευταίος και τον μηδενίζει αρκετά μετά το τέλος της αναπαραγωγής, οπότε αυτές οι τιμές καθυστερούν λίγο σε σχέση με τον ήχο.

#### Αντικείμενο κατάστασης στο `msg.payload`

: reachable (boolean | string): `true` αν το ηχείο είναι συνδεδεμένο με το bridge, `unknown` αν η κατάσταση σύνδεσης αποκλίνει
: connectionStatus (string): Η τρέχουσα κατάσταση σύνδεσης με το bridge ως συμβολοσειρά. Μπορεί να έχει τιμή `connected`, `disconnected`, `connectivity_issue` ή `unidirectional_incoming`
: playing (boolean): `true` όσο το ηχείο αναπαράγει οποιονδήποτε ήχο
: chime (string | boolean): Όνομα του ήχου κουδουνιού που παίζει ή `false`
: alarm (string | boolean): Όνομα του ήχου σειρήνας που παίζει ή `false`
: alert (string | boolean): Όνομα του ήχου ειδοποίησης που παίζει ή `false`
: muted (boolean): Δηλώνει αν το ηχείο είναι σε σίγαση
: updated (string): Χρόνος της τελευταίας ενημέρωσης του πόρου από το HueMagic (ISO 8601)

#### Πληροφορίες για το ηχείο στο `msg.info`

: id (string): Δηλώνει το νέο αναγνωριστικό του ηχείου
: idV1 (string | boolean): Δηλώνει το παλιό αναγνωριστικό του ηχείου
: uniqueId (string): Το μοναδικό αναγνωριστικό του ηχείου
: deviceId (string): Το μοναδικό αναγνωριστικό της συσκευής
: name (string): Το τρέχον όνομα του ηχείου
: type (string): Ο τύπος της συσκευής (πάντα `speaker`)
: softwareVersion (string): Το τρέχον υλικολογισμικό του ηχείου
: battery (float | boolean): Η τρέχουσα στάθμη μπαταρίας του ηχείου, `false` όταν δεν υπάρχει μπαταρία
: batteryState (string | boolean): Η τρέχουσα κατάσταση της στάθμης μπαταρίας. Μπορεί να έχει τιμή `normal`, `low` ή `critical`, ή `false` όταν δεν υπάρχει μπαταρία
: sounds (object): Περιέχει τους ήχους που γνωρίζει αυτή η συσκευή στα `chime`, `alarm` και `alert`
: model (object): Περιέχει τις πληροφορίες μοντέλου του ηχείου στα `id`, `manufacturer`, `name`, `type` και `certified`

#### Αλλαγές κατάστασης στο `msg.updated`

Απαριθμεί ως αντικείμενο τις επιμέρους παραμέτρους που άλλαξαν σε σχέση με την προηγούμενη κατάσταση του ηχείου. Αν δεν καταγράφηκαν αλλαγές, το αντικείμενο είναι κενό.

#### Τελευταία κατάσταση του ηχείου στο `msg.lastState`

Περιέχει το πλήρες αντικείμενο κατάστασης (δείτε τις τιμές εξόδου παραπάνω) της τελευταίας κατάστασης πριν από την τελευταία καταγεγραμμένη αλλαγή. Αν το HueMagic δεν έχει καταγράψει ακόμη την προηγούμενη κατάσταση, εξάγεται `false`.

#### Τελευταία εντολή στο `msg.command` (προαιρετικό)

Αν η κατάσταση του κόμβου άλλαξε μέσω κάποιας εντολής, εξάγεται και ολόκληρη η εντολή που εκτελέστηκε. Διαφορετικά ο κόμβος δεν εξάγει αυτό το αντικείμενο.

### Παραδείγματα από το HueMagic

Το HueMagic παρέχει μερικές έτοιμες ρυθμίσεις για αυτόν τον κόμβο. Για να εισαγάγετε ένα πλήρες παράδειγμα στο περιβάλλον Node-RED, πατήστε το εικονίδιο μενού του Node-RED, επιλέξτε «Import» και μεταβείτε στο «Examples» στην πλαϊνή στήλη του παραθύρου. Έπειτα επιλέξτε τον φάκελο HueMagic και τον κόμβο που θέλετε για να εισαγάγετε μια ροή παραδείγματος.
