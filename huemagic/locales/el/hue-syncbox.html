Ο κόμβος «Hue Sync Box» ελέγχει ένα Philips Hue Play HDMI Sync Box και αναφέρει τι κάνει εκείνη τη στιγμή.

### Ρύθμιση

Το sync box δεν είναι συνδεδεμένο με το Hue Bridge σας αλλά μιλά το δικό του τοπικό API, οπότε χρειάζεται δικές του ρυθμίσεις. Καταχωρίστε τη διεύθυνση IP του sync box και πατήστε το κουμπί δίπλα στο πεδίο του διακριτικού πρόσβασης. Έπειτα κρατήστε πατημένο το κουμπί στο sync box μέχρι να αναβοσβήσει πράσινη η λυχνία — το HueMagic ρωτά τη συσκευή επί ένα λεπτό και αποθηκεύει το διακριτικό μόλις εκείνη απαντήσει.

Επειδή το sync box δεν στέλνει από μόνο του την κατάστασή του, το HueMagic τη ζητά τακτικά. Πόσο συχνά γίνεται αυτό το ορίζετε στις ρυθμίσεις· η προεπιλογή είναι κάθε 10 δευτερόλεπτα. Προαιρετικά μπορείτε να απενεργοποιήσετε όλα τα αυτόματα μηνύματα κατάστασης αυτού του κόμβου με τη ρύθμιση «Παράβλεψη των μηνυμάτων του κόμβου». Εναλλακτικά μπορείτε να επιλέξετε να μην αποκρύπτεται το μήνυμα αρχικοποίησης του κόμβου κατά την εκκίνηση του Node-RED. Αν προτιμάτε ο κόμβος να παραμένει σιωπηλός μέχρι να του στείλετε κάτι, ενεργοποιήστε την «Αναφορά μόνο μετά από εντολή». Τότε αγνοεί τις αλλαγές από την εφαρμογή ή από έναν διακόπτη και απαντά μόνο στις δικές σας εντολές.

### Ανάκτηση κατάστασης

Εξάγει την τρέχουσα κατάσταση του sync box μόλις σταλεί στον κόμβο ένα αντικείμενο `msg.payload` με το παρακάτω περιεχόμενο. Εναλλακτικά μπορείτε να πατήσετε το κουμπί στο περιβάλλον του Node-RED, χωρίς να χρειάζεται να στείλετε πρώτα μήνυμα στον κόμβο.

: status (boolean): Επιστρέφει την τρέχουσα κατάσταση του sync box

### Άναμμα / σβήσιμο (απλή λειτουργία)

Για να ανάψετε ή να σβήσετε γρήγορα το sync box, στείλτε στον κόμβο ένα αντικείμενο με το παρακάτω περιεχόμενο. Στο άναμμα επανέρχεται η τελευταία λειτουργία συγχρονισμού που χρησιμοποιήθηκε.

: payload (boolean): `true` ξεκινά τον συγχρονισμό, `false` θέτει τη συσκευή σε εξοικονόμηση ενέργειας

### Εντολές του sync box (εκτεταμένες)

Στείλτε τις παρακάτω παραμέτρους σε ένα αντικείμενο `msg.payload` για πιο λεπτομερή έλεγχο του sync box:

: mode (string): Ένα από τα `powersave`, `passthrough`, `video`, `game`, `music` ή `ambient`
: sync (boolean): `true` ξεκινά τον συγχρονισμό, `false` τον σταματά
: toggle (boolean | any): Εναλλάσσει τον συγχρονισμό ανάλογα με την προηγούμενη κατάσταση
: passthrough (boolean): `true` περνά την εικόνα στην τηλεόρασή σας χωρίς συγχρονισμό
: intensity (string): Πόσο έντονα ακολουθούν τα φώτα την εικόνα. Ένα από τα `subtle`, `moderate`, `high` ή `intense`
: brightness (int): Ποσοστιαία τιμή της φωτεινότητας (0-100)
: brightnessLevel (int): Αριθμητική τιμή της φωτεινότητας όπως τη μετρά η συσκευή (0-200, με το 100 ως βάση)
: incrementBrightness (int | boolean): Δηλώνει κατά πόσες ποσοστιαίες μονάδες θα αυξηθεί η φωτεινότητα του sync box ή `true` για βήματα 10 %
: decrementBrightness (int | boolean): Δηλώνει κατά πόσες ποσοστιαίες μονάδες θα μειωθεί η φωτεινότητα του sync box ή `true` για βήματα 10 %
: input (string | int): Η είσοδος HDMI που θα εμφανιστεί, είτε `input1` έως `input4` είτε απλώς `1` έως `4`
: entertainmentArea (string): Η ζώνη ψυχαγωγίας που θα οδηγεί η συσκευή, π.χ. `groups/13`

### Μηνύματα κατάστασης του κόμβου

Κάθε φορά που αλλάζει η κατάσταση του sync box, ο κόμβος επιστρέφει το ακόλουθο μήνυμα κατάστασης:

#### Αντικείμενο κατάστασης στο `msg.payload`

: on (boolean): `false` όσο η συσκευή είναι σε εξοικονόμηση ενέργειας
: syncing (boolean): `true` όσο τα φώτα ακολουθούν την εικόνα
: passthrough (boolean): `true` όσο η συσκευή περνά την εικόνα
: mode (string): Η ενεργή λειτουργία αυτή τη στιγμή
: lastSyncMode (string): Η τελευταία λειτουργία συγχρονισμού που χρησιμοποιήθηκε
: intensity (string | boolean): Ένταση της ενεργής λειτουργίας
: brightness (int | boolean): Φωτεινότητα σε ποσοστό
: brightnessLevel (int | boolean): Φωτεινότητα όπως τη μετρά η συσκευή (0-200)
: input (string | boolean): Η είσοδος HDMI που εμφανίζεται αυτή τη στιγμή
: inputs (object): Και οι τέσσερις είσοδοι HDMI με `name`, `type`, `status` (`unplugged`, `plugged`, `linked` ή `unknown`) και αν είναι `active`
: entertainmentArea (string | boolean): Η ζώνη ψυχαγωγίας που οδηγεί η συσκευή
: updated (string): Χρόνος της τελευταίας ενημέρωσης του πόρου από το HueMagic (ISO 8601)

#### Πληροφορίες για το sync box στο `msg.info`

: id (string | boolean): Το μοναδικό αναγνωριστικό του sync box
: name (string | boolean): Το τρέχον όνομα του sync box
: type (string): Ο τύπος της συσκευής (πάντα `syncbox`)
: ipAddress (string | boolean): Η διεύθυνση IP που δηλώνει η ίδια η συσκευή
: softwareVersion (string | boolean): Το τρέχον υλικολογισμικό του sync box
: apiLevel (int | boolean): Το επίπεδο API του sync box
: ledMode (int | boolean): Η τρέχουσα λειτουργία της λυχνίας LED
: wifi (object | boolean): Περιέχει `ssid` και `strength` της ασύρματης σύνδεσης
: model (object): Περιέχει τις πληροφορίες μοντέλου του sync box στα `id`, `manufacturer` και `name`

#### Αλλαγές κατάστασης στο `msg.updated`

Απαριθμεί ως αντικείμενο τις επιμέρους παραμέτρους που άλλαξαν σε σχέση με την προηγούμενη κατάσταση του sync box. Αν δεν καταγράφηκαν αλλαγές, το αντικείμενο είναι κενό.

#### Τελευταία κατάσταση του sync box στο `msg.lastState`

Περιέχει το πλήρες αντικείμενο κατάστασης (δείτε τις τιμές εξόδου παραπάνω) της τελευταίας κατάστασης πριν από την τελευταία καταγεγραμμένη αλλαγή. Αν το HueMagic δεν έχει καταγράψει ακόμη την προηγούμενη κατάσταση, εξάγεται `false`.

#### Τελευταία εντολή στο `msg.command` (προαιρετικό)

Αν η κατάσταση του κόμβου άλλαξε μέσω κάποιας εντολής, εξάγεται και ολόκληρη η εντολή που εκτελέστηκε. Διαφορετικά ο κόμβος δεν εξάγει αυτό το αντικείμενο.

### Παραδείγματα από το HueMagic

Το HueMagic παρέχει μερικές έτοιμες ρυθμίσεις για αυτόν τον κόμβο. Για να εισαγάγετε ένα πλήρες παράδειγμα στο περιβάλλον Node-RED, πατήστε το εικονίδιο μενού του Node-RED, επιλέξτε «Import» και μεταβείτε στο «Examples» στην πλαϊνή στήλη του παραθύρου. Έπειτα επιλέξτε τον φάκελο HueMagic και τον κόμβο που θέλετε για να εισαγάγετε μια ροή παραδείγματος.
