Węzeł „Hue Grupa” steruje jednocześnie wieloma światłami zebranymi w grupę na bridge.

### Konfiguracja

Wybierz skonfigurowany Hue Bridge i kliknij przycisk wyszukiwania, aby znaleźć wszystkie dostępne grupy. Jeśli znasz już identyfikator grupy, możesz go też wpisać ręcznie. Możesz nadać grupie własną nazwę wewnętrzną albo zachować nazwę domyślną. Opcjonalnie możesz wyłączyć wszystkie automatyczne komunikaty stanu tego węzła ustawieniem „Pomijaj komunikaty węzła”. Węzeł przestanie wtedy wysyłać aktualizacje. Możesz też zdecydować, aby komunikat inicjalizacji węzła nie był pomijany przy starcie Node-RED. Po włączeniu tego ustawienia po każdym wdrożeniu otrzymasz komunikat stanu wybranej grupy. Jeśli wolisz, aby węzeł milczał, dopóki czegoś do niego nie wyślesz, włącz „Zgłaszaj tylko po poleceniu”. Węzeł zignoruje wtedy zmiany z aplikacji lub z przełącznika i odpowie wyłącznie na Twoje polecenia.

Jeśli nie wybierzesz grupy i użyjesz konfiguracji węzła w ten sposób, węzeł działa w tzw. „trybie uniwersalnym”. W tym trybie węzeł odbiera i wysyła wszystkie komunikaty stanu tego samego typu. Ustawienia w trybie uniwersalnym możesz też zastosować do konkretnej grupy, przekazując jej identyfikator jako ciąg znaków w `msg.topic` razem z ustawieniami.

### Odczyt stanu

Zwraca bieżący stan grupy, gdy tylko do węzła zostanie przekazany obiekt `msg.payload` o następującej zawartości. Możesz też nacisnąć przycisk w interfejsie Node-RED, bez wcześniejszego wysyłania komunikatu do węzła.

: status (boolean): Zwraca bieżący stan grupy

### Włączanie / wyłączanie (tryb prosty)

Aby szybko włączyć lub wyłączyć całą grupę w trybie prostym, przekaż do węzła obiekt o następującej zawartości.

: payload (boolean): `true` włącza całą grupę, `false` ją wyłącza

### Polecenia grupy (rozszerzone)

Oprócz zwykłego włączania i wyłączania dostępnych jest wiele innych opcji sterowania grupą. Wszystkie węzły HueMagic obsługują polecenia addytywne. Oznacza to, że możesz przekazać najpierw jedno ustawienie, a później w kolejnym poleceniu następne, nie odrzucając poprzedniego. Przekaż w obiekcie `msg.payload` następujące parametry, aby wykonać bardziej rozbudowane ustawienia grupy:

: on (boolean): `true` włącza całą grupę, `false` ją wyłącza
: toggle (boolean | any): Przełącza między włączeniem a wyłączeniem, zależnie od poprzedniego stanu grupy
: brightness (int | string): Procentowa wartość jasności światła (0-100) albo ciąg znaków `auto`, aby jasność była ustawiana automatycznie na podstawie bieżącej godziny
: brightnessLevel (int): Liczbowa wartość jasności światła (0-254)
: incrementBrightness (int): Procentowa wartość względnej zmiany jasności. Dopuszczalny zakres to od -100 % do +100 %. Wartości dodatnie zwiększają jasność. Domyślnie +10 %
: decrementBrightness (int): Procentowa wartość względnej zmiany jasności. Dopuszczalny zakres to od -100 % do +100 %. Wartości dodatnie zmniejszają jasność. Domyślnie +10 %
: color (string): `random`, aby ustawić losowy kolor, albo angielska nazwa koloru (np. `red`)
: hex (string): Wartość koloru w zapisie szesnastkowym jako ciąg znaków
: rgb (array [0,0,0]): Wartość koloru w formacie RGB jako tablica
: xyColor (object {x [float], y [float]}): Wartość koloru w formacie XY jako obiekt
: image (string): Ścieżka obrazu (lokalnego lub w sieci), aby ustawić bieżący kolor grupy na średni kolor obrazu
: colorTemp (int | string): Wartość od 153 do 500 ustawiająca temperaturę barwową grupy albo wartości `cold`, `normal`, `warm`, `hot` i `auto`, przy czym `auto` dobiera temperaturę barwową na podstawie bieżącej godziny
: transitionTime (float): Czas przejścia bieżącego ustawienia w sekundach. Po przekazaniu `0` grupa zmienia się natychmiast. Po przekazaniu `3` grupa przechodzi do żądanego ustawienia z łagodnym przejściem w ciągu następnych 3 sekund
: colorloop (float): Odtwarza animację „colorloop” przez wskazaną liczbę sekund, a następnie przywraca pierwotny stan grupy
: alert (float): Odtwarza animację „alert” przez wskazaną liczbę sekund, a następnie przywraca pierwotny stan grupy

### Komunikaty stanu węzła

Gdy zostanie wykryta zmiana w grupie, węzeł zwraca następujący komunikat stanu.

> [!NOTE]
> Grupa wysyła komunikaty stanu tylko wtedy, gdy zostanie wyłączone ostatnie światło albo włączone pierwsze (jeśli wcześniej wszystkie były wyłączone).

W przeciwieństwie do węzła „Hue Światło” dostępnych jest tu znacznie mniej informacji o stanie, ponieważ grupa może zawierać wiele różnych typów urządzeń o wartościach, których nie da się połączyć.

#### Obiekt stanu w `msg.payload`

: on (boolean): Stan grupy, gdzie `true` oznacza włączona, a `false` wyłączona
: brightness (float | boolean): Jasność grupy w procentach albo `false`, jeśli grupy nie można ściemniać
: brightnessLevel (int | boolean): Jasność grupy jako wartość liczbowa (0-254) albo `false`, jeśli grupy nie można ściemniać
: rgb (array [0,0,0]): Bieżący kolor grupy w formacie RGB (tylko jeśli dostępny)
: hex (string): Bieżący kolor grupy w formacie szesnastkowym (tylko jeśli dostępny)
: xyColor (object {x [float], y [float]}): Bieżący kolor grupy w formacie XY (tylko jeśli dostępny)
: colorTemp (int): Aktualnie ustawiona temperatura barwowa grupy (tylko jeśli dostępna)
: updated (string): Czas ostatniej aktualizacji zasobu przez HueMagic (ISO 8601)

#### Informacje o grupie w `msg.info`

: id (string): Wskazuje nowy identyfikator grupy
: idV1 (string | boolean): Wskazuje stary identyfikator grupy
: name (string): Aktualnie ustawiona nazwa grupy
: resources (object) : Zawiera wszystkie urządzenia i zasoby należące do grupy
: type (string): Typ grupy (zawsze `group`)

#### Zmiany stanu w `msg.updated`

Wymienia w postaci obiektu poszczególne parametry, które zmieniły się względem poprzedniego stanu grupy. Jeśli nie zarejestrowano żadnych zmian, obiekt jest pusty.

#### Poprzedni stan światła w `msg.lastState`

Zawiera pełny obiekt stanu (patrz wartości wyjściowe powyżej) sprzed ostatniej zmiany. Jeśli HueMagic nie zarejestrował jeszcze poprzedniego stanu, zwracane jest `false`.

#### Ostatnie polecenie w `msg.command` (opcjonalnie)

Jeśli stan węzła zmienił się w wyniku określonego polecenia, wysyłane jest również całe wykonane polecenie. W przeciwnym razie węzeł nie wysyła tego obiektu.

### Przykłady z HueMagic

HueMagic udostępnia kilka przykładowych konfiguracji dla tego węzła. Aby zaimportować gotowy przykład do interfejsu Node-RED, kliknij ikonę menu Node-RED, wybierz „Import”, a następnie przejdź do „Examples” na pasku bocznym okna. Wybierz katalog HueMagic i żądany węzeł, aby zaimportować przykładowy przepływ.
