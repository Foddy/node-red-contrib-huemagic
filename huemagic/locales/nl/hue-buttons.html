De node "Hue Knoppen" ontvangt schakelgebeurtenissen van invoerapparaten die met de bridge zijn verbonden.

### Instellen

Selecteer de vooraf geconfigureerde Hue Bridge en klik op de zoekknop om alle beschikbare schakelaars en knoppen te vinden. Als u het ID van de schakelaar of knop al kent, kunt u het hier ook handmatig invoeren. U kunt het apparaat intern een nieuwe naam geven of de vooraf ingestelde naam behouden. Optioneel kunt u alle automatische statusberichten van deze node uitschakelen met de instelling "Berichten van de node negeren". De node geeft dan geen schakelgebeurtenissen meer uit. U kunt ook kiezen of het initialisatiebericht van de node bij het starten van Node-RED niet wordt onderdrukt. Als u deze instelling activeert, ontvangt u na elke deploy een statusbericht van de geselecteerde schakelaar of knop. Wilt u liever dat de node stil blijft totdat u er iets naartoe stuurt, activeer dan "Alleen na een commando melden". De node negeert dan wijzigingen vanuit de app of een schakelaar en antwoordt alleen op uw eigen commando's.

Als u geen schakelaar of knop selecteert en de nodeconfiguratie zo gebruikt, werkt de node in de zogenoemde "universele modus". In deze modus ontvangt en verstuurt de node alle statusberichten van hetzelfde type.

### Status opvragen

Geeft de huidige status van de schakelaar of knop uit zodra een `msg.payload`-object met de volgende inhoud aan de node is doorgegeven. U kunt ook op de knop in de Node-RED-interface drukken zonder eerst een bericht naar de node te sturen.

: status (boolean): Geeft de huidige status van de schakelaar of knop terug

### Statusberichten van de node

Zodra er op een toets is gedrukt, geeft de node het volgende statusbericht terug:

#### Statusobject onder `msg.payload`

: reachable (boolean | string): `true` als de schakelaar of knop met de bridge is verbonden, `unknown` als de verbindingsstatus afwijkt
: connectionStatus (string): De huidige verbindingsstatus met de bridge als tekenreeks. Kan `connected`, `disconnected`, `connectivity_issue` of `unidirectional_incoming` als waarde bevatten
: button (int | boolean): Numeriek ID van de laatst ingedrukte toets of `false` als er geen toets is ingedrukt
: action (string | boolean): `false` als er geen toets is ingedrukt, of `initial_press`, `repeat`, `short_release`, `long_press`, `long_release` of `double_short_release` als tekenreeks
: rotation (object | boolean): `false` als het apparaat geen draaiknop heeft of niet is gedraaid, anders een object met `action` (`start` of `repeat`), `direction` (`clock_wise` of `counter_clock_wise`), `clockwise` (boolean), `steps` (1000 stappen zijn een volledige omwenteling), `degrees` en `duration` in milliseconden
: updated (string): Tijdstip van de laatste update van de bron door HueMagic (ISO 8601)

#### Informatie over de schakelaar of knop onder `msg.info`

: id (string): Geeft het nieuwe ID van de schakelaar of knop aan
: idV1 (string | boolean): Geeft het oude ID van de schakelaar of knop aan
: uniqueId (string): Het unieke ID van de schakelaar of knop
: deviceId (string): Het unieke ID van het apparaat
: name (string): De momenteel ingestelde naam van de schakelaar of knop
: type (string): Het type van de schakelaar of knop (altijd `button`)
: softwareVersion (string): De huidige firmware van de schakelaar of knop
: battery (float | boolean): Het huidige batterijniveau van de schakelaar of knop, `false` als er geen batterij is
: batteryState (string | boolean): De huidige status van het batterijniveau. Kan `normal`, `low` of `critical` als waarde bevatten, of `false` als er geen batterij is
: model (object): Bevat de modelinformatie van de schakelaar of knop onder `id`, `manufacturer`, `name`, `type` en `certified`

#### Statuswijzigingen onder `msg.updated`

Somt in de vorm van een object de afzonderlijke parameters op die ten opzichte van de vorige toestand van de schakelaar of knop zijn gewijzigd. Als er geen wijzigingen zijn geregistreerd, is dit object leeg.

#### Laatste toestand van de schakelaar of knop onder `msg.lastState`

Bevat het volledige statusobject (zie de uitvoerwaarden hierboven) van de laatste toestand vóór de laatst geregistreerde wijziging. Als HueMagic de laatste toestand nog niet heeft geregistreerd, wordt `false` uitgegeven.

#### Laatste commando onder `msg.command` (optioneel)

Als de status van de node door een bepaald commando is gewijzigd, wordt ook het volledige uitgevoerde commando meegegeven. Anders geeft de node dit object niet uit.

### Voorbeelden van HueMagic

HueMagic stelt enkele voorbeeldconfiguraties voor deze node beschikbaar. Om een volledig voorbeeld in uw Node-RED-interface te importeren, klikt u op het menupictogram van Node-RED, kiest u "Import" en navigeert u in de zijbalk van het pop-upvenster naar "Examples". Selecteer vervolgens de map HueMagic en de gewenste node om een voorbeeldflow te importeren.
