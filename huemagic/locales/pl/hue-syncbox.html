Węzeł „Hue Sync Box” steruje urządzeniem Philips Hue Play HDMI Sync Box i informuje, co ono aktualnie robi.

### Konfiguracja

Sync box nie jest połączony z Twoim Hue Bridge, lecz korzysta z własnego lokalnego API, dlatego wymaga osobnej konfiguracji. Wpisz adres IP swojego sync box i kliknij przycisk obok pola tokenu dostępu. Następnie przytrzymaj przycisk na sync box, aż dioda zamiga na zielono — HueMagic przez minutę odpytuje urządzenie i zapisuje token, gdy tylko ono odpowie.

Ponieważ sync box nie wysyła swojego stanu samodzielnie, HueMagic regularnie o niego pyta. Częstotliwość ustawisz w konfiguracji; domyślnie jest to co 10 sekund. Opcjonalnie możesz wyłączyć wszystkie automatyczne komunikaty stanu tego węzła ustawieniem „Pomijaj komunikaty węzła”. Możesz też zdecydować, aby komunikat inicjalizacji węzła nie był pomijany przy starcie Node-RED. Jeśli wolisz, aby węzeł milczał, dopóki czegoś do niego nie wyślesz, włącz „Zgłaszaj tylko po poleceniu”. Węzeł zignoruje wtedy zmiany z aplikacji lub z przełącznika i odpowie wyłącznie na Twoje polecenia.

### Odczyt stanu

Zwraca bieżący stan sync box, gdy tylko do węzła zostanie przekazany obiekt `msg.payload` o następującej zawartości. Możesz też nacisnąć przycisk w interfejsie Node-RED, bez wcześniejszego wysyłania komunikatu do węzła.

: status (boolean): Zwraca bieżący stan sync box

### Włączanie / wyłączanie (tryb prosty)

Aby szybko włączyć lub wyłączyć sync box, przekaż do węzła obiekt o następującej zawartości. Po włączeniu przywracany jest ostatnio używany tryb synchronizacji.

: payload (boolean): `true` uruchamia synchronizację, `false` przełącza urządzenie w tryb oszczędzania energii

### Polecenia sync box (rozszerzone)

Przekaż w obiekcie `msg.payload` następujące parametry, aby dokładniej sterować sync box:

: mode (string): Jedna z wartości: `powersave`, `passthrough`, `video`, `game`, `music` lub `ambient`
: sync (boolean): `true` uruchamia synchronizację, `false` ją zatrzymuje
: toggle (boolean | any): Przełącza synchronizację zależnie od poprzedniego stanu
: passthrough (boolean): `true` przekazuje obraz do telewizora bez synchronizacji
: intensity (string): Jak mocno światła podążają za obrazem. Jedna z wartości: `subtle`, `moderate`, `high` lub `intense`
: brightness (int): Procentowa wartość jasności (0-100)
: brightnessLevel (int): Liczbowa wartość jasności w skali urządzenia (0-200, gdzie 100 to wartość bazowa)
: incrementBrightness (int | boolean): Określa, o ile procent zwiększyć jasność sync box, albo `true` dla kroków co 10 %
: decrementBrightness (int | boolean): Określa, o ile procent zmniejszyć jasność sync box, albo `true` dla kroków co 10 %
: input (string | int): Wejście HDMI, które ma być pokazane: `input1` do `input4` albo po prostu `1` do `4`
: entertainmentArea (string): Strefa rozrywki, którą ma sterować urządzenie, np. `groups/13`

### Komunikaty stanu węzła

Za każdym razem, gdy zmieni się stan sync box, węzeł zwraca następujący komunikat stanu:

#### Obiekt stanu w `msg.payload`

: on (boolean): `false`, gdy urządzenie jest w trybie oszczędzania energii
: syncing (boolean): `true`, gdy światła podążają za obrazem
: passthrough (boolean): `true`, gdy urządzenie przekazuje obraz dalej
: mode (string): Aktualnie aktywny tryb
: lastSyncMode (string): Ostatnio używany tryb synchronizacji
: intensity (string | boolean): Intensywność aktualnie aktywnego trybu
: brightness (int | boolean): Jasność w procentach
: brightnessLevel (int | boolean): Jasność w skali urządzenia (0-200)
: input (string | boolean): Aktualnie pokazywane wejście HDMI
: inputs (object): Wszystkie cztery wejścia HDMI wraz z polami `name`, `type`, `status` (`unplugged`, `plugged`, `linked` lub `unknown`) oraz informacją, czy są `active`
: entertainmentArea (string | boolean): Strefa rozrywki sterowana przez urządzenie
: updated (string): Czas ostatniej aktualizacji zasobu przez HueMagic (ISO 8601)

#### Informacje o sync box w `msg.info`

: id (string | boolean): Unikatowy identyfikator sync box
: name (string | boolean): Aktualnie ustawiona nazwa sync box
: type (string): Typ urządzenia (zawsze `syncbox`)
: ipAddress (string | boolean): Adres IP, który urządzenie podaje dla siebie
: softwareVersion (string | boolean): Bieżące oprogramowanie układowe sync box
: apiLevel (int | boolean): Poziom API sync box
: ledMode (int | boolean): Aktualnie ustawiony tryb diody LED
: wifi (object | boolean): Zawiera `ssid` i `strength` połączenia bezprzewodowego
: model (object): Zawiera informacje o modelu sync box w polach `id`, `manufacturer` i `name`

#### Zmiany stanu w `msg.updated`

Wymienia w postaci obiektu poszczególne parametry, które zmieniły się względem poprzedniego stanu sync box. Jeśli nie zarejestrowano żadnych zmian, obiekt jest pusty.

#### Poprzedni stan sync box w `msg.lastState`

Zawiera pełny obiekt stanu (patrz wartości wyjściowe powyżej) sprzed ostatniej zarejestrowanej zmiany. Jeśli HueMagic nie zarejestrował jeszcze poprzedniego stanu, zwracane jest `false`.

#### Ostatnie polecenie w `msg.command` (opcjonalnie)

Jeśli stan węzła zmienił się w wyniku określonego polecenia, wysyłane jest również całe wykonane polecenie. W przeciwnym razie węzeł nie wysyła tego obiektu.

### Przykłady z HueMagic

HueMagic udostępnia kilka przykładowych konfiguracji dla tego węzła. Aby zaimportować gotowy przykład do interfejsu Node-RED, kliknij ikonę menu Node-RED, wybierz „Import”, a następnie przejdź do „Examples” na pasku bocznym okna. Wybierz katalog HueMagic i żądany węzeł, aby zaimportować przykładowy przepływ.
