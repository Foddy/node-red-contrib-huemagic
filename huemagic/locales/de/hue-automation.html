<script type="text/markdown" data-help-name="hue-automation">
Der „Hue Automation“-Node kann die Automationen aktivieren und deaktivieren, die Sie in der Philips Hue App angelegt haben.

### Einrichtung

Wählen Sie die vorkonfigurierte Hue Bridge und klicken Sie auf die Suchschaltfläche, um alle verfügbaren Automationen zu finden. Wenn Sie die ID der Automation bereits kennen, können Sie sie auch manuell an dieser Stelle eintragen. Sie können intern entweder einen neuen Namen für die Automation vergeben oder den vordefinierten Namen wählen. Optional können Sie auch alle automatischen Statusmeldungen dieses Nodes deaktivieren, indem Sie die Einstellung „Ignoriere die Mitteilungen des Nodes“ anklicken. Der Node wird anschließend keine Updates mehr ausgeben. Alternativ können Sie auch auswählen, ob die Initialisierungsnachricht des Nodes beim Start von Node-RED nicht unterdrückt werden soll. Wenn Sie diese Einstellung aktivieren, erhalten Sie nach jedem Deploy eine Statusmeldung der aktuell ausgewählten Automation. Wenn der Node lieber still bleiben soll, bis Sie ihm etwas schicken, aktivieren Sie „Nur nach einem Befehl melden“. Er ignoriert dann Änderungen aus der App oder von einem Schalter und antwortet nur auf Ihre eigenen Befehle.

Wenn Sie keine Automation auswählen und die Node-Konfiguration so anwenden, arbeitet der Node im sogenannten „Universalmodus“. In diesem Modus empfängt der Node alle Statusmitteilungen desselben Typs und gibt diese aus. Sie können aber auch Einstellungen im Universalmodus auf eine bestimmte Automation anwenden, indem Sie die entsprechende Automations-ID als String in `msg.topic` zusammen mit Ihren Einstellungen übergeben.

### Automation aktivieren / deaktivieren

Eine deaktivierte Automation bleibt auf der Bridge erhalten und kann jederzeit wieder aktiviert werden. Übergeben Sie dafür ein Objekt mit folgendem Inhalt:

: payload (boolean) : `true` aktiviert die Automation, `false` deaktiviert sie
: enabled (boolean) : Dasselbe wie oben, falls Sie lieber ein Objekt übergeben
: toggle (boolean | any) : Wechselt zwischen aktiviert und deaktiviert, abhängig vom vorherigen Zustand

### Statusnachrichten des Nodes

Sobald sich die Automation ändert, wird folgende Statusnachricht vom Node zurückgegeben:

#### Statusobjekt unter `msg.payload`

: enabled (boolean) : Zeigt an, ob die Automation aktiviert ist
: running (boolean) : `true`, solange die Bridge die Automation tatsächlich ausführt
: status (string | boolean) : Der aktuelle Status. Kann `initializing`, `running`, `disabled` oder `errored` als Wert beinhalten
: lastError (string | boolean) : Der letzte von der Bridge gemeldete Fehler oder `false`
: updated (string) : Zeitpunkt der letzten Aktualisierung der Ressource von HueMagic (ISO 8601)

#### Informationen zur Automation unter `msg.info`

: id (string) : Gibt die ID der Automation an
: idV1 (string | boolean) : Gibt die alte ID der Automation an
: name (string | boolean) : Der Name, den Sie der Automation in der Philips Hue App gegeben haben
: type (string) : Der Typ der Ressource (immer `automation`)
: script (string | boolean) : Die ID des Verhaltensskripts hinter der Automation

#### Konfiguration unter `msg.configuration`

Beinhaltet die Einstellungen der Automation, so wie sie von der Philips Hue App hinterlegt wurden. Der Aufbau hängt von der Art der Automation ab und wird unverändert durchgereicht.

#### Statusänderungen unter `msg.updated`

Listet einzelne Parameter in Form eines Objekts auf, die sich im Vergleich zum letzten Zustand der Automation geändert haben. Wenn keine Änderungen registriert wurden, ist dieses Objekt leer.

#### Letzter Zustand der Automation unter `msg.lastState`

Beinhaltet das komplette Statusobjekt (siehe Ausgabewerte oben) des letzten Zustands vor der zuletzt registrierten Änderung. Wenn der letzte Zustand von HueMagic noch nicht registriert wurde, wird `false` ausgegeben.

#### Letzter Befehl unter `msg.command` (optional)

Wenn sich der Status des Nodes über einen bestimmten Befehl geändert hat, wird zusätzlich der komplette Befehl ausgegeben, der ausgeführt wurde. Andernfalls wird dieses Objekt vom Node nicht ausgegeben.

### Beispiele von HueMagic

HueMagic stellt einige Beispielkonfigurationen zu diesem Node zur Verfügung. Um ein fertiges Beispiel in Ihrer Node-RED-Oberfläche zu importieren, klicken Sie auf das Menü-Icon von Node-RED, wählen Sie dann „Import“ und navigieren Sie in der Sidebar des Popups auf „Beispiele“. Wählen Sie anschließend den HueMagic-Ordner aus und Ihren gewünschten Node, um einen Beispielflow zu importieren.
