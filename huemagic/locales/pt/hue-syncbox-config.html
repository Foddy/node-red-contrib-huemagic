<script type="text/markdown" data-help-name="hue-syncbox-config">
Liga-se a uma Philips Hue Play HDMI Sync Box.

### Nome

Pode atribuir à sync box um nome interno alternativo ou manter o nome predefinido.

### IP da Sync Box

O endereço IP da sua sync box na rede local. Assim que o introduzir, o HueMagic tenta ler o nome do aparelho e preenche-o por si.

### Token de acesso

A sync box não faz parte do seu Hue Bridge e precisa do seu próprio token. Clique no botão junto ao campo e mantenha depois premido o botão da sync box até o LED piscar a verde. O HueMagic continua a interrogar o aparelho durante um minuto e guarda o token assim que este responder.

### Atualização

A sync box não envia o seu estado por iniciativa própria, por isso o HueMagic pergunta-lho regularmente. Esta definição determina quantos segundos decorrem entre dois pedidos. O valor predefinido de 10 segundos é um bom compromisso entre um estado reativo e o tráfego de rede — não o reduza mais do que realmente precisa.
