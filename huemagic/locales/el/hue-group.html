Ο κόμβος «Hue Ομάδα» μπορεί να ελέγχει ταυτόχρονα πολλά φώτα που ανήκουν σε μια ομάδα στο bridge.

### Ρύθμιση

Επιλέξτε το προρυθμισμένο Hue Bridge και πατήστε το κουμπί αναζήτησης για να βρείτε όλες τις διαθέσιμες ομάδες. Αν γνωρίζετε ήδη το αναγνωριστικό μιας ομάδας, μπορείτε να το καταχωρίσετε και χειροκίνητα. Μπορείτε να δώσετε στην ομάδα ένα νέο εσωτερικό όνομα ή να κρατήσετε το προκαθορισμένο. Προαιρετικά μπορείτε να απενεργοποιήσετε όλα τα αυτόματα μηνύματα κατάστασης αυτού του κόμβου με τη ρύθμιση «Παράβλεψη των μηνυμάτων του κόμβου». Ο κόμβος δεν θα εκπέμπει πλέον ενημερώσεις. Εναλλακτικά μπορείτε να επιλέξετε να μην αποκρύπτεται το μήνυμα αρχικοποίησης του κόμβου κατά την εκκίνηση του Node-RED. Αν ενεργοποιήσετε αυτή τη ρύθμιση, θα λαμβάνετε μήνυμα κατάστασης της επιλεγμένης ομάδας μετά από κάθε deploy. Αν προτιμάτε ο κόμβος να παραμένει σιωπηλός μέχρι να του στείλετε κάτι, ενεργοποιήστε την «Αναφορά μόνο μετά από εντολή». Τότε αγνοεί τις αλλαγές από την εφαρμογή ή από έναν διακόπτη και απαντά μόνο στις δικές σας εντολές.

Αν δεν επιλέξετε ομάδα και χρησιμοποιήσετε έτσι τις ρυθμίσεις του κόμβου, ο κόμβος λειτουργεί στη λεγόμενη «καθολική λειτουργία». Σε αυτήν τη λειτουργία ο κόμβος λαμβάνει και εκπέμπει όλα τα μηνύματα κατάστασης ίδιου τύπου. Μπορείτε επίσης να εφαρμόσετε ρυθμίσεις σε συγκεκριμένη ομάδα στέλνοντας το αντίστοιχο αναγνωριστικό ως συμβολοσειρά στο `msg.topic` μαζί με τις ρυθμίσεις σας.

### Ανάκτηση κατάστασης

Εξάγει την τρέχουσα κατάσταση της ομάδας μόλις σταλεί στον κόμβο ένα αντικείμενο `msg.payload` με το παρακάτω περιεχόμενο. Εναλλακτικά μπορείτε να πατήσετε το κουμπί στο περιβάλλον του Node-RED, χωρίς να χρειάζεται να στείλετε πρώτα μήνυμα στον κόμβο.

: status (boolean): Επιστρέφει την τρέχουσα κατάσταση της ομάδας

### Άναμμα / σβήσιμο (απλή λειτουργία)

Για να ανάψετε ή να σβήσετε γρήγορα μια ολόκληρη ομάδα στην απλή λειτουργία, στείλτε στον κόμβο ένα αντικείμενο με το παρακάτω περιεχόμενο.

: payload (boolean): `true` ανάβει ολόκληρη την ομάδα, `false` τη σβήνει

### Εντολές ομάδας (εκτεταμένες)

Πέρα από το απλό άναμμα και σβήσιμο υπάρχουν πολλές ακόμη δυνατότητες ελέγχου της ομάδας. Όλοι οι κόμβοι του HueMagic ελέγχονται με προσθετικές εντολές. Αυτό σημαίνει ότι μπορείτε να στείλετε πρώτα μια ρύθμιση και αργότερα μια άλλη, χωρίς να ακυρωθεί η προηγούμενη. Στείλτε τις παρακάτω παραμέτρους σε ένα αντικείμενο `msg.payload` για πιο εκτενείς ρυθμίσεις στην ομάδα:

: on (boolean): `true` ανάβει ολόκληρη την ομάδα, `false` τη σβήνει
: toggle (boolean | any): Εναλλάσσει μεταξύ ανάμματος και σβησίματος, ανάλογα με την προηγούμενη κατάσταση της ομάδας
: brightness (int | string): Ποσοστιαία τιμή της φωτεινότητας (0-100) ή συμβολοσειρά με την τιμή `auto` για αυτόματη ρύθμιση της φωτεινότητας με βάση την τρέχουσα ώρα
: brightnessLevel (int): Αριθμητική τιμή της φωτεινότητας (0-254)
: incrementBrightness (int): Ποσοστιαία τιμή σχετικής μεταβολής φωτεινότητας. Το έγκυρο εύρος είναι από -100 % έως +100 %. Οι θετικές τιμές αυξάνουν τη φωτεινότητα. Προεπιλογή +10 %
: decrementBrightness (int): Ποσοστιαία τιμή σχετικής μεταβολής φωτεινότητας. Το έγκυρο εύρος είναι από -100 % έως +100 %. Οι θετικές τιμές μειώνουν τη φωτεινότητα. Προεπιλογή +10 %
: color (string): `random` για τυχαίο χρώμα ή αγγλικό όνομα χρώματος (π.χ. `red`)
: hex (string): Τιμή χρώματος σε δεκαεξαδική μορφή ως συμβολοσειρά
: rgb (array [0,0,0]): Τιμή χρώματος σε μορφή RGB ως πίνακας
: xyColor (object {x [float], y [float]}): Τιμή χρώματος στη μορφή XY ως αντικείμενο
: image (string): Διαδρομή μιας εικόνας (τοπικά ή στο διαδίκτυο) για να οριστεί το τρέχον χρώμα της ομάδας στο μέσο χρώμα της εικόνας
: colorTemp (int | string): Τιμή μεταξύ 153 και 500 για τη θερμοκρασία χρώματος της ομάδας ή οι τιμές `cold`, `normal`, `warm`, `hot` και `auto` — όπου `auto` ορίζει τη θερμοκρασία χρώματος με βάση την τρέχουσα ώρα
: transitionTime (float): Χρόνος μετάβασης της τρέχουσας ρύθμισης σε δευτερόλεπτα. Αν σταλεί `0`, η ομάδα αλλάζει αμέσως. Αν στείλετε `3`, η ομάδα μεταβαίνει στη ρύθμιση με ήπια μετάβαση μέσα στα επόμενα 3 δευτερόλεπτα
: colorloop (float): Αναπαράγει μια κινούμενη σκηνή «colorloop» για τα επιλεγμένα δευτερόλεπτα και έπειτα επαναφέρει την αρχική κατάσταση της ομάδας
: alert (float): Αναπαράγει μια κινούμενη σκηνή «alert» για τα επιλεγμένα δευτερόλεπτα και έπειτα επαναφέρει την αρχική κατάσταση της ομάδας

### Μηνύματα κατάστασης του κόμβου

Όταν εντοπιστεί αλλαγή στην ομάδα, ο κόμβος επιστρέφει το ακόλουθο μήνυμα κατάστασης.

> [!NOTE]
> Η ομάδα εκπέμπει μηνύματα κατάστασης μόνο όταν σβήνει το τελευταίο φως ή όταν ανάβει το πρώτο (αν προηγουμένως ήταν όλα σβηστά).

Σε αντίθεση με τον κόμβο «Hue Φως», εδώ έχετε πολύ λιγότερες πληροφορίες κατάστασης, καθώς μια ομάδα μπορεί να περιέχει πολλούς διαφορετικούς τύπους συσκευών με τιμές που δεν συνδυάζονται.

#### Αντικείμενο κατάστασης στο `msg.payload`

: on (boolean): Κατάσταση της ομάδας, όπου `true` σημαίνει αναμμένη και `false` σβηστή
: brightness (float | boolean): Φωτεινότητα της ομάδας σε ποσοστό ή `false` αν η ομάδα δεν μπορεί να ρυθμιστεί
: brightnessLevel (int | boolean): Φωτεινότητα της ομάδας ως αριθμητική τιμή (0-254) ή `false` αν η ομάδα δεν μπορεί να ρυθμιστεί
: rgb (array [0,0,0]): Τρέχον χρώμα της ομάδας σε μορφή RGB (μόνο αν είναι διαθέσιμο)
: hex (string): Τρέχον χρώμα της ομάδας σε δεκαεξαδική μορφή (μόνο αν είναι διαθέσιμο)
: xyColor (object {x [float], y [float]}): Τρέχον χρώμα της ομάδας στη μορφή XY (μόνο αν είναι διαθέσιμο)
: colorTemp (int): Η τρέχουσα ορισμένη θερμοκρασία χρώματος της ομάδας (μόνο αν είναι διαθέσιμη)
: updated (string): Χρόνος της τελευταίας ενημέρωσης του πόρου από το HueMagic (ISO 8601)

#### Πληροφορίες για την ομάδα στο `msg.info`

: id (string): Δηλώνει το νέο αναγνωριστικό της ομάδας
: idV1 (string | boolean): Δηλώνει το παλιό αναγνωριστικό της ομάδας
: name (string): Το τρέχον όνομα της ομάδας
: resources (object) : Περιέχει όλες τις συσκευές και τους πόρους πίσω από την ομάδα
: type (string): Ο τύπος της ομάδας (πάντα `group`)

#### Αλλαγές κατάστασης στο `msg.updated`

Απαριθμεί ως αντικείμενο τις επιμέρους παραμέτρους που άλλαξαν σε σχέση με την προηγούμενη κατάσταση της ομάδας. Αν δεν καταγράφηκαν αλλαγές, το αντικείμενο είναι κενό.

#### Τελευταία κατάσταση του φωτός στο `msg.lastState`

Περιέχει το πλήρες αντικείμενο κατάστασης (δείτε τις τιμές εξόδου παραπάνω) της τελευταίας κατάστασης πριν από την τελευταία αλλαγή. Αν το HueMagic δεν έχει καταγράψει ακόμη την προηγούμενη κατάσταση, εξάγεται `false`.

#### Τελευταία εντολή στο `msg.command` (προαιρετικό)

Αν η κατάσταση του κόμβου άλλαξε μέσω κάποιας εντολής, εξάγεται και ολόκληρη η εντολή που εκτελέστηκε. Διαφορετικά ο κόμβος δεν εξάγει αυτό το αντικείμενο.

### Παραδείγματα από το HueMagic

Το HueMagic παρέχει μερικές έτοιμες ρυθμίσεις για αυτόν τον κόμβο. Για να εισαγάγετε ένα πλήρες παράδειγμα στο περιβάλλον Node-RED, πατήστε το εικονίδιο μενού του Node-RED, επιλέξτε «Import» και μεταβείτε στο «Examples» στην πλαϊνή στήλη του παραθύρου. Έπειτα επιλέξτε τον φάκελο HueMagic και τον κόμβο που θέλετε για να εισαγάγετε μια ροή παραδείγματος.
