Ο κόμβος «Hue Αυτοματισμός» μπορεί να ενεργοποιεί και να απενεργοποιεί τους αυτοματισμούς που δημιουργήσατε στην εφαρμογή Philips Hue.

### Ρύθμιση

Επιλέξτε το προρυθμισμένο Hue Bridge και πατήστε το κουμπί αναζήτησης για να βρείτε όλους τους διαθέσιμους αυτοματισμούς. Αν γνωρίζετε ήδη το αναγνωριστικό του αυτοματισμού, μπορείτε να το καταχωρίσετε και χειροκίνητα. Μπορείτε να δώσετε στον αυτοματισμό ένα νέο εσωτερικό όνομα ή να κρατήσετε το προκαθορισμένο. Προαιρετικά μπορείτε να απενεργοποιήσετε όλα τα αυτόματα μηνύματα κατάστασης αυτού του κόμβου με τη ρύθμιση «Παράβλεψη των μηνυμάτων του κόμβου». Ο κόμβος δεν θα εκπέμπει πλέον ενημερώσεις. Εναλλακτικά μπορείτε να επιλέξετε να μην αποκρύπτεται το μήνυμα αρχικοποίησης του κόμβου κατά την εκκίνηση του Node-RED. Αν ενεργοποιήσετε αυτή τη ρύθμιση, θα λαμβάνετε μήνυμα κατάστασης του επιλεγμένου αυτοματισμού μετά από κάθε deploy. Αν προτιμάτε ο κόμβος να παραμένει σιωπηλός μέχρι να του στείλετε κάτι, ενεργοποιήστε την «Αναφορά μόνο μετά από εντολή». Τότε αγνοεί τις αλλαγές από την εφαρμογή ή από έναν διακόπτη και απαντά μόνο στις δικές σας εντολές.

Αν δεν επιλέξετε αυτοματισμό και χρησιμοποιήσετε έτσι τις ρυθμίσεις του κόμβου, ο κόμβος λειτουργεί στη λεγόμενη «καθολική λειτουργία». Σε αυτήν τη λειτουργία ο κόμβος λαμβάνει και εκπέμπει όλα τα μηνύματα κατάστασης ίδιου τύπου. Μπορείτε επίσης να εφαρμόσετε ρυθμίσεις σε συγκεκριμένο αυτοματισμό στέλνοντας το αντίστοιχο αναγνωριστικό ως συμβολοσειρά στο `msg.topic` μαζί με τις ρυθμίσεις σας.

### Ενεργοποίηση / απενεργοποίηση του αυτοματισμού

Ένας απενεργοποιημένος αυτοματισμός παραμένει στο bridge και μπορεί να ενεργοποιηθεί ξανά οποιαδήποτε στιγμή. Στείλτε γι' αυτό ένα αντικείμενο με το παρακάτω περιεχόμενο:

: payload (boolean): `true` ενεργοποιεί τον αυτοματισμό, `false` τον απενεργοποιεί
: enabled (boolean): Όπως παραπάνω, αν προτιμάτε να στείλετε αντικείμενο
: toggle (boolean | any): Εναλλάσσει μεταξύ ενεργοποιημένου και απενεργοποιημένου, ανάλογα με την προηγούμενη κατάσταση

### Μηνύματα κατάστασης του κόμβου

Μόλις αλλάξει ο αυτοματισμός, ο κόμβος επιστρέφει το ακόλουθο μήνυμα κατάστασης:

#### Αντικείμενο κατάστασης στο `msg.payload`

: enabled (boolean): Δηλώνει αν ο αυτοματισμός είναι ενεργοποιημένος
: running (boolean): `true` όσο το bridge εκτελεί πράγματι τον αυτοματισμό
: status (string | boolean): Η τρέχουσα κατάσταση. Μπορεί να έχει τιμή `initializing`, `running`, `disabled` ή `errored`
: lastError (string | boolean): Το τελευταίο σφάλμα που ανέφερε το bridge ή `false`
: updated (string): Χρόνος της τελευταίας ενημέρωσης του πόρου από το HueMagic (ISO 8601)

#### Πληροφορίες για τον αυτοματισμό στο `msg.info`

: id (string): Δηλώνει το αναγνωριστικό του αυτοματισμού
: idV1 (string | boolean): Δηλώνει το παλιό αναγνωριστικό του αυτοματισμού
: name (string | boolean): Το όνομα που δώσατε στον αυτοματισμό στην εφαρμογή Philips Hue
: type (string): Ο τύπος του πόρου (πάντα `automation`)
: script (string | boolean): Το αναγνωριστικό του σεναρίου συμπεριφοράς πίσω από τον αυτοματισμό

#### Ρυθμίσεις στο `msg.configuration`

Περιέχει τις ρυθμίσεις του αυτοματισμού όπως τις αποθήκευσε η εφαρμογή Philips Hue. Η δομή εξαρτάται από τον τύπο του αυτοματισμού και μεταβιβάζεται αναλλοίωτη.

#### Αλλαγές κατάστασης στο `msg.updated`

Απαριθμεί ως αντικείμενο τις επιμέρους παραμέτρους που άλλαξαν σε σχέση με την προηγούμενη κατάσταση του αυτοματισμού. Αν δεν καταγράφηκαν αλλαγές, το αντικείμενο είναι κενό.

#### Τελευταία κατάσταση του αυτοματισμού στο `msg.lastState`

Περιέχει το πλήρες αντικείμενο κατάστασης (δείτε τις τιμές εξόδου παραπάνω) της τελευταίας κατάστασης πριν από την τελευταία καταγεγραμμένη αλλαγή. Αν το HueMagic δεν έχει καταγράψει ακόμη την προηγούμενη κατάσταση, εξάγεται `false`.

#### Τελευταία εντολή στο `msg.command` (προαιρετικό)

Αν η κατάσταση του κόμβου άλλαξε μέσω κάποιας εντολής, εξάγεται και ολόκληρη η εντολή που εκτελέστηκε. Διαφορετικά ο κόμβος δεν εξάγει αυτό το αντικείμενο.

### Παραδείγματα από το HueMagic

Το HueMagic παρέχει μερικές έτοιμες ρυθμίσεις για αυτόν τον κόμβο. Για να εισαγάγετε ένα πλήρες παράδειγμα στο περιβάλλον Node-RED, πατήστε το εικονίδιο μενού του Node-RED, επιλέξτε «Import» και μεταβείτε στο «Examples» στην πλαϊνή στήλη του παραθύρου. Έπειτα επιλέξτε τον φάκελο HueMagic και τον κόμβο που θέλετε για να εισαγάγετε μια ροή παραδείγματος.
