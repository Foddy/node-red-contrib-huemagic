El nodo «Hue Botones» recibe los eventos de conmutación de los dispositivos de entrada conectados al bridge.

### Configuración

Seleccione el Hue Bridge preconfigurado y haga clic en el botón de búsqueda para encontrar todos los interruptores y botones disponibles. Si ya conoce el ID del interruptor o botón, también puede introducirlo aquí manualmente. Puede asignar internamente un nombre nuevo al dispositivo o conservar su nombre predefinido. De forma opcional, puede desactivar todos los mensajes de estado automáticos de este nodo mediante el ajuste «Omitir los mensajes del nodo». El nodo dejará entonces de emitir eventos de conmutación. También puede elegir que el mensaje de inicialización del nodo no se suprima al iniciar Node-RED. Si activa este ajuste, recibirá un mensaje de estado del interruptor o botón seleccionado después de cada despliegue. Si prefiere que el nodo permanezca en silencio hasta que usted le envíe algo, active «Informar solo tras un comando». En ese caso ignorará los cambios realizados desde la app o desde un interruptor y solo responderá a sus propios comandos.

Si no selecciona ningún interruptor o botón y utiliza así la configuración del nodo, el nodo funciona en el llamado «modo universal». En este modo, el nodo recibe y emite todos los mensajes de estado del mismo tipo.

### Consultar el estado

Emite el estado actual del interruptor o botón en cuanto se transfiere al nodo un objeto `msg.payload` con el siguiente contenido. Como alternativa, también puede pulsar el botón en la interfaz de Node-RED sin tener que enviar antes ningún mensaje al nodo.

: status (boolean): Devuelve el estado actual del interruptor o botón

### Mensajes de estado del nodo

En cuanto se pulsa una tecla, el nodo devuelve el siguiente mensaje de estado:

#### Objeto de estado en `msg.payload`

: reachable (boolean | string): `true` si el interruptor o botón está conectado al bridge, `unknown` si el estado de la conexión difiere
: connectionStatus (string): El estado actual de la conexión con el bridge en forma de cadena. Puede contener `connected`, `disconnected`, `connectivity_issue` o `unidirectional_incoming` como valor
: button (int | boolean): ID numérico de la tecla pulsada en último lugar o `false` si no se ha pulsado ninguna
: action (string | boolean): `false` si no se ha pulsado ninguna tecla, o bien `initial_press`, `repeat`, `short_release`, `long_press`, `long_release` o `double_short_release` en forma de cadena
: rotation (object | boolean): `false` si el dispositivo no tiene rueda o no se ha girado; en caso contrario, un objeto con `action` (`start` o `repeat`), `direction` (`clock_wise` o `counter_clock_wise`), `clockwise` (booleano), `steps` (1000 pasos equivalen a una vuelta completa), `degrees` y `duration` en milisegundos
: updated (string): Momento de la última actualización del recurso por parte de HueMagic (ISO 8601)

#### Información sobre el interruptor o botón en `msg.info`

: id (string): Indica el nuevo ID del interruptor o botón
: idV1 (string | boolean): Indica el ID antiguo del interruptor o botón
: uniqueId (string): El ID único del interruptor o botón
: deviceId (string): El ID único del dispositivo
: name (string): El nombre asignado actualmente al interruptor o botón
: type (string): El tipo del interruptor o botón (siempre `button`)
: softwareVersion (string): El firmware actual del interruptor o botón
: battery (float | boolean): El nivel de batería actual del interruptor o botón, `false` si no hay batería
: batteryState (string | boolean): El estado actual del nivel de batería. Puede contener `normal`, `low` o `critical` como valor, o `false` si no hay batería
: model (object): Contiene la información de modelo del interruptor o botón en `id`, `manufacturer`, `name`, `type` y `certified`

#### Cambios de estado en `msg.updated`

Enumera en forma de objeto los parámetros concretos que han cambiado con respecto al último estado del interruptor o botón. Si no se ha registrado ningún cambio, este objeto está vacío.

#### Último estado del interruptor o botón en `msg.lastState`

Contiene el objeto de estado completo (véanse los valores de salida anteriores) del último estado antes del último cambio registrado. Si HueMagic aún no ha registrado el último estado, se emite `false`.

#### Último comando en `msg.command` (opcional)

Si el estado del nodo ha cambiado mediante un comando concreto, también se emite el comando completo que se ha ejecutado. De lo contrario, el nodo no emite este objeto.

### Ejemplos de HueMagic

HueMagic pone a su disposición algunas configuraciones de ejemplo para este nodo. Para importar un ejemplo completo en su interfaz de Node-RED, haga clic en el icono de menú de Node-RED, seleccione «Importar» y navegue hasta «Ejemplos» en la barra lateral de la ventana emergente. A continuación, seleccione la carpeta HueMagic y el nodo que desee para importar un flujo de ejemplo.
