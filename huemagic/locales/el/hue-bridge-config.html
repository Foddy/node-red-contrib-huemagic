Συνδέεται σε ένα Philips Hue Bridge.

### Όνομα

Μπορείτε να δώσετε στο bridge ένα εναλλακτικό, εσωτερικό όνομα ή να κρατήσετε το προεπιλεγμένο.

### IP και θύρα του bridge

Καταχωρίστε χειροκίνητα τη διεύθυνση IP του Hue Bridge ή πατήστε το κουμπί για να εμφανιστούν όλα τα τοπικά διαθέσιμα bridge (συνιστάται στατική διαμόρφωση IP στο Hue Bridge). Προαιρετικά μπορείτε να ορίσετε και διαφορετική θύρα για το bridge, προσθέτοντας άνω και κάτω τελεία στη διεύθυνση IP.

### Κλειδί API

Καταχωρίστε χειροκίνητα το κλειδί API του Hue Bridge ή πατήστε το κουμπί για να δημιουργήσετε νέο κλειδί. Για να δημιουργηθεί νέο κλειδί, πρέπει να πατήσετε το φυσικό κουμπί του bridge μέσα σε 20 δευτερόλεπτα ώστε να ολοκληρωθεί η διαδικασία.

### Διεργασίες

Η τιμή «Διεργασίες» καθορίζει πόσες παράλληλες εντολές επιτρέπεται να στέλνει το HueMagic ταυτόχρονα στο bridge. Σύμφωνα με την επίσημη τεκμηρίωση του Philips Hue Bridge δεν πρέπει να στέλνονται περισσότερες από 10 εντολές ανά δευτερόλεπτο, αλλιώς υπάρχει κίνδυνος το bridge να μην προλαβαίνει να επεξεργαστεί τα αιτήματα και να επιστρέφει σφάλματα.

Αν σταλούν ταυτόχρονα περισσότερες εντολές από την τιμή που ορίζεται εδώ, το HueMagic θα τις εκτελέσει διαδοχικά μόλις γίνει ξανά εφικτό.

Ορίστε αυτήν την τιμή κάτω από 10 (π.χ. 4 έως 7) αν στέλνετε εντολές στο bridge και εκτός του HueMagic, ώστε να τηρείται ο ρυθμός εντολών ανά δευτερόλεπτο που συνιστά η Philips Hue.

### Αυτόματες ενημερώσεις υλικολογισμικού

Το HueMagic ελέγχει περιοδικά για διαθέσιμες ενημερώσεις υλικολογισμικού Philips Hue και τις εγκαθιστά αυτόματα όταν υπάρχουν. Μπορείτε να απενεργοποιήσετε αυτήν τη συμπεριφορά επιλέγοντας το αντίστοιχο πλαίσιο ελέγχου.

### Απενεργοποίηση ειδοποιήσεων

Αν ενεργοποιήσετε αυτήν τη ρύθμιση, όλοι οι κόμβοι πίσω από αυτό το bridge δεν θα λαμβάνουν πλέον αυτόματα μηνύματα κατάστασης.
