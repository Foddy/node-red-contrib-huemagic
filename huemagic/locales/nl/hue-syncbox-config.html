<script type="text/markdown" data-help-name="hue-syncbox-config">
Maakt verbinding met een Philips Hue Play HDMI Sync Box.

### Naam

U kunt de sync box een alternatieve, interne naam geven of de standaardnaam behouden.

### IP van de Sync Box

Het IP-adres van uw sync box in uw lokale netwerk. Zodra u het hebt ingevoerd, probeert HueMagic de naam van het apparaat uit te lezen en vult die voor u in.

### Toegangstoken

De sync box maakt geen deel uit van uw Hue Bridge en heeft een eigen token nodig. Klik op de knop naast het veld en houd daarna de knop op de sync box ingedrukt totdat de led groen knippert. HueMagic blijft het apparaat een minuut lang bevragen en slaat het token op zodra het antwoordt.

### Verversen

De sync box stuurt zijn status niet uit zichzelf, dus HueMagic vraagt er regelmatig naar. Deze instelling bepaalt hoeveel seconden er tussen twee aanvragen zitten. De standaardwaarde van 10 seconden is een goed compromis tussen een vlotte status en netwerkverkeer — zet hem niet lager dan u werkelijk nodig hebt.
