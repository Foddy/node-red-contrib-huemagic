«Hue Kural» düğümü, bridge'de kayıtlı kuralları etkinleştirebilir veya devre dışı bırakabilir ve ayarlarını sorgulayabilir.

### Kurulum

Önceden yapılandırılmış Hue Bridge'i seçin ve mevcut tüm kuralları bulmak için arama düğmesine tıklayın. Kuralın kimliğini zaten biliyorsanız, buraya elle de girebilirsiniz. Alternatif olarak kurala yeni bir ad verebilir veya önceden tanımlı adı kullanabilirsiniz. İsteğe bağlı olarak «Düğümün mesajlarını yoksay» ayarıyla bu düğümün tüm otomatik durum mesajlarını devre dışı bırakabilirsiniz. Düğüm bundan sonra güncelleme yayınlamaz. Alternatif olarak, Node-RED başlatılırken düğümün başlatma mesajının bastırılmamasını seçebilirsiniz. Düğümün siz bir şey gönderene kadar sessiz kalmasını tercih ediyorsanız «Yalnızca bir komuttan sonra bildir» seçeneğini etkinleştirin. Bu durumda uygulamadan veya bir anahtardan gelen değişiklikleri yok sayar ve yalnızca sizin komutlarınıza yanıt verir.

Bir kural seçmez ve düğüm yapılandırmasını bu şekilde kullanırsanız, düğüm «evrensel mod» adı verilen modda çalışır. Bu modda düğüm aynı türdeki tüm durum mesajlarını alır ve yayınlar. Evrensel modda ayarları belirli bir kurala uygulamak için ilgili kural kimliğini `msg.topic` içinde dize olarak ayarlarınızla birlikte gönderebilirsiniz.

### Özellikleri / ayarları sorgulama

Düğüme aşağıdaki içeriğe sahip bir `msg.payload` nesnesi iletildiğinde kuralın güncel özelliklerini verir. Alternatif olarak, önce düğüme bir mesaj göndermeden Node-RED arayüzündeki düğmeye de basabilirsiniz.

: status (boolean): Kuralın güncel durumunu döndürür

### Kuralı etkinleştirme / devre dışı bırakma

Kural gerektiğinde etkinleştirilip devre dışı bırakılabilir. Kural devre dışı bırakıldığında, siz yeniden etkinleştirene kadar bridge içinde çalışmaz. Bunun için aşağıdaki içeriğe sahip bir nesne gönderin:

: payload (boolean): `true` kuralı etkinleştirir, `false` devre dışı bırakır

### Düğümün durum mesajları

Bir kuralın durumu (etkin / devre dışı) değiştiği anda düğüm aşağıdaki durum mesajını döndürür:

#### `msg.payload` altındaki durum nesnesi

: enabled (boolean): Kuralın etkin mi devre dışı mı olduğunu belirtir
: triggered (string): Son çalıştırma zamanı (ISO 8601)

#### `msg.info` altındaki kural bilgileri

: id (string): Kuralın benzersiz kimliği
: created (string): Kuralın oluşturulma tarihi (ISO 8601)
: name (string): Kuralın bridge üzerindeki adı
: timesTriggered (int): Kuralın bridge üzerinde kaç kez çalıştırıldığı
: owner (string): Bu kuralın sahibinin kimliği
: status (string): Kuralın durumu (dize olarak)

#### `msg.conditions` altındaki kural koşulları (dizi)

: address (string): Bir sensörün özniteliğine giden yol
: operator (string): İşleç
: value (string): Denetlenecek değer

#### `msg.actions` altındaki kural eylemleri (dizi)

: address (string): Kaynağın hedef adresi
: method (string): İstek yöntemi
: body (object): Gerçekleştirilecek eylem

#### `msg.updated` altındaki durum değişiklikleri

Kuralın önceki durumuna kıyasla değişen parametreleri bir nesne olarak listeler. Herhangi bir değişiklik kaydedilmediyse bu nesne boştur.

#### `msg.lastState` altındaki son kural durumu

Kuralın son kaydedilen değişikliğinden önceki durumun eksiksiz nesnesini içerir (yukarıdaki çıktı değerlerine bakın). HueMagic önceki durumu henüz kaydetmediyse `false` verilir.

#### `msg.command` altındaki son komut (isteğe bağlı)

Düğümün durumu belirli bir komutla değiştiyse, yürütülen komutun tamamı da çıktı olarak verilir. Aksi hâlde düğüm bu nesneyi çıktı olarak vermez.

### HueMagic örnekleri

HueMagic bu düğüm için bazı örnek yapılandırmalar sunar. Node-RED arayüzünüze eksiksiz bir örnek aktarmak için Node-RED menü simgesine tıklayın, «Import» seçeneğini seçin ve açılan pencerenin kenar çubuğunda «Examples» bölümüne gidin. Ardından HueMagic klasörünü ve istediğiniz düğümü seçerek örnek bir akış aktarın.
