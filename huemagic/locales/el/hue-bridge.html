<script type="text/markdown" data-help-name="hue-bridge-node">
Ο κόμβος «Hue Bridge» είναι ένας καθολικός κόμβος που μπορεί να εξάγει όλες τις ρυθμίσεις του bridge και τα μηνύματα κατάστασης των άλλων κόμβων.

### Ρύθμιση

Επιλέξτε πρώτα το Hue Bridge που θέλετε. Προαιρετικά μπορείτε να απενεργοποιήσετε όλα τα αυτόματα μηνύματα κατάστασης αυτού του κόμβου με τη ρύθμιση «Παράβλεψη των καθολικών ενημερώσεων και μηνυμάτων συσκευών σε αυτόν τον κόμβο». Ο κόμβος δεν θα εκπέμπει πλέον ενημερώσεις συσκευής.

Εναλλακτικά μπορείτε να επιλέξετε να μην αποκρύπτονται τα μηνύματα αρχικοποίησης όλων των κόμβων κατά την εκκίνηση του Node-RED. Αν ενεργοποιήσετε αυτή τη ρύθμιση, θα λαμβάνετε μετά από κάθε deploy μήνυμα κατάστασης από όλους τους πόρους που είναι συνδεδεμένοι στο bridge.

### Ανάκτηση ρυθμίσεων / κατάστασης

Εξάγει την τρέχουσα κατάσταση και τις ρυθμίσεις του bridge μόλις σταλεί στον κόμβο το παρακάτω μήνυμα. Εναλλακτικά μπορείτε να πατήσετε το κουμπί στο περιβάλλον του Node-RED, χωρίς να χρειάζεται να στείλετε πρώτα μήνυμα στον κόμβο.

: payload (boolean): Επιστρέφει την τρέχουσα κατάσταση του bridge

### Έναρξη σάρωσης TouchLink

Με μια «σάρωση TouchLink» μπορείτε να συνδέσετε νέες ή παλιές συσκευές στο bridge (π.χ. μετά από επαναφορά). Στείλτε γι' αυτό το αντικείμενο `msg.payload` με το παρακάτω περιεχόμενο:

: touchLink (boolean): Συνδέει παλιές ή νέες συσκευές με το bridge

### Ανάκτηση όλων των συσκευών και πόρων

Με την εντολή «fetch» μπορείτε να λάβετε λίστα συγκεκριμένων συσκευών που είναι αυτή τη στιγμή συνδεδεμένες στο bridge. Στείλτε γι' αυτό το αντικείμενο `msg.payload` με το παρακάτω περιεχόμενο:

: fetch (string | array [string, ...]): Δέχεται `light`, `group`, `button`, `motion`, `temperature`, `light_level` ή `rule` ως τιμή/τιμές

### Αλλαγή ρυθμίσεων του Hue Bridge

Με την παρακάτω εντολή μπορείτε να αλλάξετε συγκεκριμένες ρυθμίσεις στο bridge. Στείλτε στον κόμβο το αντικείμενο `msg.payload.settings` με τις εξής επιλογές:

> [!WARNING]
> Η αλλαγή των ρυθμίσεων δικτύου απαιτεί εκ νέου διαμόρφωση του bridge στο HueMagic.

: name (string): Αλλάζει το όνομα του bridge και πρέπει να έχει από 4 έως 16 χαρακτήρες
: zigbeeChannel (int): Αλλάζει το τρέχον κανάλι ZigBee (`11`, `15`, `20`, `25` ή `0`)
: ipAddress (string): Αλλάζει τη διεύθυνση IP στις ρυθμίσεις δικτύου
: dhcpEnabled (boolean): `true` ενεργοποιεί το DHCP στις ρυθμίσεις δικτύου, `false` το απενεργοποιεί
: netmask (string): Αλλάζει τη μάσκα δικτύου στις ρυθμίσεις δικτύου
: gateway (string): Ορίζει την πύλη στις ρυθμίσεις δικτύου
: proxyAddress (string): Ορίζει διεύθυνση διαμεσολαβητή στις ρυθμίσεις δικτύου
: proxyPort (string | int): Ορίζει τη θύρα του διαμεσολαβητή στις ρυθμίσεις δικτύου
: timeZone (string): Αλλάζει την τρέχουσα ζώνη ώρας στο bridge

### Μηνύματα κατάστασης του κόμβου

Τα μηνύματα κατάστασης του κόμβου «Hue Bridge» είναι δυναμικά. Αν και ακολουθούν ένα μοτίβο, η έξοδός τους μπορεί να διαφέρει ανάλογα με την ενέργεια που μόλις εκτελέστηκε στον κόμβο.

#### Αντικείμενο κατάστασης στο `msg.payload`

: id (string): Μοναδικό αναγνωριστικό του Hue Bridge
: name (string): Τρέχον όνομα
: factoryNew (boolean): Δηλώνει αν το bridge είναι ολοκαίνουργιο
: replacesBridgeId (string | boolean): Επιστρέφει το παλιό αναγνωριστικό του bridge (αν έγινε μετάβαση) ή `false`
: dataStoreVersion (string): Έκδοση του χώρου αποθήκευσης δεδομένων
: starterKitId (string | boolean): Όνομα του εργοστασιακού πακέτου εκκίνησης ή `false`
: softwareVersion (string): Έκδοση λογισμικού του bridge
: apiVersion (string): Έκδοση API του bridge
: zigbeeChannel (int): Το κανάλι ZigBee που χρησιμοποιείται
: macAddress (string): Διεύθυνση MAC του bridge
: ipAddress (string): Διεύθυνση IP του bridge
: dhcpEnabled (boolean): Δηλώνει αν το DHCP είναι ενεργοποιημένο
: netmask (string): Μάσκα δικτύου του bridge
: gateway (string): Πύλη του bridge
: proxyAddress (string | boolean): Η διεύθυνση διαμεσολαβητή που χρησιμοποιείται ή `false`
: proxyPort (string): Η θύρα διαμεσολαβητή που χρησιμοποιείται
: utcTime (string): Ώρα UTC στο bridge
: timeZone (string): Η τρέχουσα ζώνη ώρας στο bridge
: localTime (string): Τοπική ζώνη ώρας
: portalServicesEnabled (boolean): Δηλώνει αν οι υπηρεσίες πύλης είναι ενεργοποιημένες
: portalConnected (boolean): Δηλώνει αν το bridge είναι συνδεδεμένο στην πύλη
: linkButtonEnabled (boolean): Δηλώνει αν το κουμπί σύνδεσης είναι ενεργοποιημένο
: touchlinkEnabled (boolean): Δηλώνει αν το TouchLink είναι ενεργοποιημένο
: autoUpdatesEnabled (boolean): Δηλώνει αν το HueMagic θα ελέγχει αυτόματα για ενημερώσεις
: users (array [object, ...]): Λίστα όλων των χρηστών στο bridge (πίνακας αντικειμένων)
: updated (string): Χρόνος της τελευταίας ενημέρωσης του πόρου από το HueMagic (ISO 8601)
: model (object): Περιέχει τις πληροφορίες μοντέλου του bridge στα `id`, `manufacturer` και `name`

#### Αποτελέσματα «fetch» στο `msg.results` (προαιρετικό)

Αν στον κόμβο χρησιμοποιήθηκε η εντολή «fetch», το bridge εξάγει τα αντίστοιχα αποτελέσματα στο αντικείμενο `msg.results`. Το αντικείμενο περιέχει τις ομάδες πόρων που ζητήθηκαν, οι οποίες με τη σειρά τους περιέχουν όλους τους σχετικούς πόρους ως πίνακα.

#### Καθολικά μηνύματα κατάστασης στο `msg.updated` (προαιρετικό)

Εκτός αν απενεργοποιηθεί, ο κόμβος εξάγει ένα ενημερωμένο μήνυμα κατάστασης για κάθε πόρο στο bridge. Το μήνυμα στο `msg.updated` ακολουθεί το μοτίβο του εκάστοτε πόρου και διαφέρει ανάλογα με τον τύπο της συσκευής που ενημερώθηκε τελευταία.

#### Τελευταία εντολή στο `msg.command` (προαιρετικό)

Αν η κατάσταση του κόμβου άλλαξε μέσω κάποιας εντολής, εξάγεται και ολόκληρη η εντολή που εκτελέστηκε. Διαφορετικά ο κόμβος δεν εξάγει αυτό το αντικείμενο.

### Παραδείγματα από το HueMagic

Το HueMagic παρέχει μερικές έτοιμες ρυθμίσεις για αυτόν τον κόμβο. Για να εισαγάγετε ένα πλήρες παράδειγμα στο περιβάλλον Node-RED, πατήστε το εικονίδιο μενού του Node-RED, επιλέξτε «Import» και μεταβείτε στο «Examples» στην πλαϊνή στήλη του παραθύρου. Έπειτα επιλέξτε τον φάκελο HueMagic και τον κόμβο που θέλετε για να εισαγάγετε μια ροή παραδείγματος.
