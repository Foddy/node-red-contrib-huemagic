<script type="text/markdown" data-help-name="hue-syncbox-config">
Verbindet sich mit einer Philips Hue Play HDMI Sync Box.

### Name

Sie können der Sync Box entweder einen alternativen, internen Namen geben oder den Standardnamen beibehalten.

### Sync Box IP

Die IP-Adresse Ihrer Sync Box im lokalen Netzwerk. Sobald Sie sie eingetragen haben, versucht HueMagic den Namen der Box auszulesen und für Sie einzutragen.

### Zugriffstoken

Die Sync Box gehört nicht zu Ihrer Hue Bridge und braucht ein eigenes Token. Klicken Sie auf die Schaltfläche neben dem Feld und halten Sie anschließend die Taste an der Sync Box gedrückt, bis ihre LED grün blinkt. HueMagic fragt die Box eine Minute lang und speichert das Token, sobald sie antwortet.

### Aktualisierung

Die Sync Box meldet ihren Zustand nicht von sich aus, deshalb fragt HueMagic sie regelmäßig ab. Diese Einstellung legt fest, wie viele Sekunden zwischen zwei Abfragen liegen. Die Voreinstellung von 10 Sekunden ist ein guter Kompromiss zwischen einem aktuellen Status und Netzwerklast — stellen Sie sie nicht niedriger als nötig.
