<script type="text/markdown" data-help-name="hue-syncbox-config">
Si collega a una Philips Hue Play HDMI Sync Box.

### Nome

Può assegnare alla sync box un nome interno alternativo oppure mantenere quello predefinito.

### IP della Sync Box

L'indirizzo IP della sua sync box nella rete locale. Appena lo inserisce, HueMagic prova a leggere il nome del dispositivo e lo compila al posto suo.

### Token di accesso

La sync box non fa parte del suo Hue Bridge e necessita di un proprio token. Faccia clic sul pulsante accanto al campo e tenga poi premuto il pulsante sulla sync box finché il LED non lampeggia in verde. HueMagic continua a interrogare il dispositivo per un minuto e memorizza il token non appena risponde.

### Aggiornamento

La sync box non invia da sola il proprio stato, quindi HueMagic lo richiede regolarmente. Questa impostazione definisce quanti secondi intercorrono tra due richieste. Il valore predefinito di 10 secondi è un buon compromesso tra reattività dello stato e traffico di rete: non lo riduca più del necessario.
