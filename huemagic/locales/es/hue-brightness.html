El nodo «Hue Luminosidad» puede leer el nivel de luz actual de un sensor adecuado conectado al bridge.

### Configuración

Seleccione el Hue Bridge preconfigurado y haga clic en el botón de búsqueda para encontrar todos los sensores disponibles. Si ya conoce el ID del sensor, también puede introducirlo aquí manualmente. Puede asignar internamente un nombre nuevo al sensor o utilizar el nombre predefinido. De forma opcional, puede desactivar todos los mensajes de estado automáticos de este nodo mediante el ajuste «Omitir los mensajes del nodo». El nodo dejará entonces de emitir actualizaciones del dispositivo. También puede elegir que el mensaje de inicialización del nodo no se suprima al iniciar Node-RED. Si activa este ajuste, recibirá un mensaje de estado del sensor seleccionado después de cada despliegue. Si prefiere que el nodo permanezca en silencio hasta que usted le envíe algo, active «Informar solo tras un comando». En ese caso ignorará los cambios realizados desde la app o desde un interruptor y solo responderá a sus propios comandos.

El ajuste «Oscuro por debajo de» determina a partir de qué nivel de luz el nodo considera que una habitación está a oscuras. Una habitación con una lámpara potente necesita un valor muy distinto al de un pasillo sin ventanas, así que introduzca sencillamente el número de lux que se ajuste a su estancia. Los valores `dark` y `daylight` se guiarán entonces por su ajuste en lugar de por el valor predeterminado de 90 lux.

Si no selecciona ningún sensor y utiliza así la configuración del nodo, el nodo funciona en el llamado «modo universal». En este modo, el nodo recibe y emite todos los mensajes de estado del mismo tipo. También puede aplicar ajustes en modo universal a un sensor concreto pasando el ID del sensor correspondiente como cadena en `msg.topic` junto con sus ajustes.

### Consultar el estado

Emite el estado actual del sensor en cuanto se transfiere al nodo un objeto `msg.payload` con el siguiente contenido. Como alternativa, también puede pulsar el botón en la interfaz de Node-RED sin tener que enviar antes ningún mensaje al nodo.

: status (boolean): Devuelve el estado actual del sensor

### Encender / apagar el sensor

Si es necesario, el sensor puede encenderse y apagarse de forma remota. Si el sensor está apagado, deja de registrar cambios en el nivel de luz y, por tanto, ya no los emite. Para ello, pase un objeto con el siguiente contenido:

: payload (boolean): `true` enciende el sensor, `false` lo apaga

### Mensajes de estado del nodo

En cuanto el sensor detecta un cambio en el nivel de luz, se devuelve el siguiente mensaje de estado:

#### Objeto de estado en `msg.payload`

: active (boolean): Indica si el sensor está encendido o apagado
: reachable (boolean | string): `true` si el sensor está conectado al bridge, `unknown` si el estado de la conexión difiere
: connectionStatus (string): El estado actual de la conexión con el bridge en forma de cadena. Puede contener `connected`, `disconnected`, `connectivity_issue` o `unidirectional_incoming` como valor
: lux (int): Indica el valor LUX real del nivel de luz
: lightLevel (int): Indica la intensidad lumínica del sensor
: dark (boolean): `true` si se ha registrado oscuridad
: daylight (boolean): `true` si se ha registrado luz diurna
: darkThreshold (int): El nivel de luz en lux por debajo del cual el nodo informa de oscuridad
: updated (string): Momento de la última actualización del recurso por parte de HueMagic (ISO 8601)

#### Información sobre el sensor en `msg.info`

: id (string): Indica el nuevo ID del sensor
: idV1 (string | boolean): Indica el ID antiguo del sensor
: uniqueId (string): El ID único del sensor
: deviceId (string): El ID único del dispositivo
: name (string): El nombre asignado actualmente al sensor
: type (string): El tipo de sensor (siempre `light_level`)
: softwareVersion (string): El firmware actual del sensor
: battery (float): El nivel de batería actual del sensor
: batteryState (string): El estado actual del nivel de batería. Puede contener `normal`, `low` o `critical` como valor
: model (object): Contiene la información de modelo del sensor en `id`, `manufacturer`, `name`, `type` y `certified`

#### Cambios de estado en `msg.updated`

Enumera en forma de objeto los parámetros concretos que han cambiado con respecto al último estado del sensor. Si no se ha registrado ningún cambio, este objeto está vacío.

#### Último estado del sensor en `msg.lastState`

Contiene el objeto de estado completo (véanse los valores de salida anteriores) del último estado antes del último cambio registrado. Si HueMagic aún no ha registrado el último estado, se emite `false`.

#### Último comando en `msg.command` (opcional)

Si el estado del nodo ha cambiado mediante un comando concreto, también se emite el comando completo que se ha ejecutado. De lo contrario, el nodo no emite este objeto.

### Ejemplos de HueMagic

HueMagic pone a su disposición algunas configuraciones de ejemplo para este nodo. Para importar un ejemplo completo en su interfaz de Node-RED, haga clic en el icono de menú de Node-RED, seleccione «Importar» y navegue hasta «Ejemplos» en la barra lateral de la ventana emergente. A continuación, seleccione la carpeta HueMagic y el nodo que desee para importar un flujo de ejemplo.
