<script type="text/markdown" data-help-name="hue-contact">
Der „Hue Kontaktsensor“-Node zeigt an, ob ein Kontaktsensor (z. B. Hue Secure) gerade geöffnet oder geschlossen ist.

### Einrichtung

Wählen Sie die vorkonfigurierte Hue Bridge und klicken Sie auf die Suchschaltfläche, um alle verfügbaren Sensoren zu finden. Wenn Sie die ID des Sensors bereits kennen, können Sie sie auch manuell an dieser Stelle eintragen. Sie können intern entweder einen neuen Namen für den Sensor vergeben oder den vordefinierten Namen des Sensors wählen. Optional können Sie auch alle automatischen Statusmeldungen dieses Nodes deaktivieren, indem Sie die Einstellung „Ignoriere die Mitteilungen des Nodes“ anklicken. Der Node wird anschließend keine Geräteupdates mehr ausgeben. Alternativ können Sie auch auswählen, ob die Initialisierungsnachricht des Nodes beim Start von Node-RED nicht unterdrückt werden soll. Wenn Sie diese Einstellung aktivieren, erhalten Sie nach jedem Deploy eine Statusmeldung des aktuell ausgewählten Sensors. Wenn der Node lieber still bleiben soll, bis Sie ihm etwas schicken, aktivieren Sie „Nur nach einem Befehl melden“. Er ignoriert dann Änderungen aus der App oder von einem Schalter und antwortet nur auf Ihre eigenen Befehle.

Wenn Sie keinen Sensor auswählen und die Node-Konfiguration so anwenden, arbeitet der Node im sogenannten „Universalmodus“. In diesem Modus empfängt der Node alle Statusmitteilungen desselben Typs und gibt diese aus. Sie können aber auch Einstellungen im Universalmodus auf einen bestimmten Sensor anwenden, indem Sie die entsprechende Sensor-ID als String in `msg.topic` zusammen mit Ihren Einstellungen übergeben.

### Status abrufen

Gibt den aktuellen Status des Sensors aus, sobald ein `msg.payload`-Objekt mit folgendem Inhalt an den Node übergeben wurde. Sie können alternativ auch den Button in der Node-RED-Oberfläche betätigen, ohne vorher eine Nachricht an den Node übergeben zu müssen.

: status (boolean) : Gibt den aktuellen Status des Sensors zurück

### Sensor ein- / ausschalten

Der Sensor kann im Bedarfsfall ferngesteuert ein- und ausgeschaltet werden. Wenn der Sensor ausgeschaltet wurde, registriert er keine Kontaktänderungen mehr und gibt diese entsprechend auch nicht mehr aus. Übergeben Sie dafür ein Objekt mit folgendem Inhalt:

: payload (boolean) : `true` schaltet den Sensor ein, `false` schaltet ihn aus

### Statusnachrichten des Nodes

Sobald sich der Kontakt ändert, wird folgende Statusnachricht vom Node zurückgegeben:

#### Statusobjekt unter `msg.payload`

: active (boolean) : Zeigt an, ob der Sensor ein- oder ausgeschaltet ist
: reachable (boolean | string) : `true` wenn der Sensor mit der Bridge verbunden ist, `unknown` wenn der Verbindungsstatus abweicht
: connectionStatus (string) : Der aktuelle Verbindungsstatus mit der Bridge in Form eines Strings. Kann `connected`, `disconnected`, `connectivity_issue` oder `unidirectional_incoming` als Wert beinhalten
: contact (string | boolean) : `contact` wenn der Kontakt geschlossen ist, `no_contact` wenn er geöffnet ist oder `false`, wenn der Sensor noch nichts gemeldet hat
: changed (string | boolean) : Zeitpunkt der letzten Kontaktänderung (ISO 8601) oder `false`, wenn der Sensor noch nichts gemeldet hat
: tampered (boolean) : Nur bei Sensoren mit Manipulationserkennung verfügbar, `true` wenn am Sensor manipuliert wurde
: updated (string) : Zeitpunkt der letzten Aktualisierung der Ressource von HueMagic (ISO 8601)

#### Informationen zum Sensor unter `msg.info`

: id (string) : Gibt die neue ID des Sensors an
: idV1 (string | boolean) : Gibt die alte ID des Sensors an
: uniqueId (string) : Die eindeutige ID des Sensors
: deviceId (string) : Die eindeutige ID des Geräts
: name (string) : Der aktuell gesetzte Name des Sensors
: type (string) : Der Typ des Sensors (immer `contact`)
: softwareVersion (string) : Die aktuelle Firmware des Sensors
: battery (float | boolean) : Der aktuelle Batteriestand des Sensors, `false` wenn keine Batterie vorhanden ist
: batteryState (string | boolean) : Der aktuelle Zustand des Batteriestands. Kann `normal`, `low` oder `critical` als Wert beinhalten, `false` wenn keine Batterie vorhanden ist
: model (object) : Beinhaltet die Modellinformationen des Sensors unter `id`, `manufacturer`, `name`, `type` und `certified`

#### Statusänderungen unter `msg.updated`

Listet einzelne Parameter in Form eines Objekts auf, die sich im Vergleich zum letzten Zustand des Sensors geändert haben. Wenn keine Änderungen registriert wurden, ist dieses Objekt leer.

#### Letzter Zustand des Sensors unter `msg.lastState`

Beinhaltet das komplette Statusobjekt (siehe Ausgabewerte oben) des letzten Zustands vor der zuletzt registrierten Änderung. Wenn der letzte Zustand von HueMagic noch nicht registriert wurde, wird `false` ausgegeben.

#### Letzter Befehl unter `msg.command` (optional)

Wenn sich der Status des Nodes über einen bestimmten Befehl geändert hat, wird zusätzlich der komplette Befehl ausgegeben, der ausgeführt wurde. Andernfalls wird dieses Objekt vom Node nicht ausgegeben.

### Beispiele von HueMagic

HueMagic stellt einige Beispielkonfigurationen zu diesem Node zur Verfügung. Um ein fertiges Beispiel in Ihrer Node-RED-Oberfläche zu importieren, klicken Sie auf das Menü-Icon von Node-RED, wählen Sie dann „Import“ und navigieren Sie in der Sidebar des Popups auf „Beispiele“. Wählen Sie anschließend den HueMagic-Ordner aus und Ihren gewünschten Node, um einen Beispielflow zu importieren.
